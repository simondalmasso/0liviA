<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020706">
<title>0liviA</title>
<style>
:root{color-scheme:dark;--bg:#020706;--ink:#eafffc;--muted:#68938f;--cyan:#19fff0;--panel:#06100f;--panel2:#0a1715;--danger:#ff6477}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
button,input{font:inherit}
button{border:0;color:inherit;background:transparent;cursor:pointer}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{height:100svh;display:grid;grid-template-rows:auto 1fr auto;max-width:1120px;margin:auto}
.topbar{height:64px;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 8px}
.brand{font-size:15px;letter-spacing:.17em;font-weight:600;margin-right:auto}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(8,28,25,.66)}
.icon:active{background:rgba(10,43,38,.8)}
.core-dot{width:7px;height:7px;border-radius:50%;background:#596b69;box-shadow:none}
.core-dot.online{background:var(--cyan);box-shadow:0 0 12px rgba(25,255,240,.7)}
.core-dot.locked{background:#ffc45d}
.chat-title{max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8ab0ac;font-size:12px}
.messages{min-height:0;overflow:auto;padding:24px clamp(16px,5vw,72px) 150px;scrollbar-width:none}
.messages::-webkit-scrollbar{display:none}
.empty{height:100%;display:grid;place-items:center;color:#31514e;font-size:12px;letter-spacing:.08em}
.msg{display:flex;margin:0 0 20px}
.msg.user{justify-content:flex-end}
.msg.assistant{justify-content:flex-start}
.bubble{max-width:min(76ch,86%);white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{padding:11px 14px;border-radius:18px 18px 5px 18px;background:#0b2421;color:#d9fffb}
.assistant .bubble{padding:2px 0;color:#ddf4f1}
.pending .bubble{opacity:.64}
.pending-mark{width:5px;height:5px;border-radius:50%;background:#4d7772;margin:10px 7px 0 0}
.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px max(14px,env(safe-area-inset-bottom));pointer-events:none}
.composer{pointer-events:auto;display:flex;align-items:flex-end;gap:8px;max-width:860px;margin:auto;padding:6px 6px 6px 16px;border-radius:26px;background:#081310;box-shadow:0 14px 48px rgba(0,0,0,.36)}
.composer input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);padding:11px 0}
.composer input::placeholder{color:#57716e}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#00211e;flex:0 0 auto}
.send.stop{background:#2e1719;color:#ff8493}
.drawer-backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.52);display:none}
.drawer-backdrop.open{display:block}
.drawer{position:fixed;z-index:50;inset:0 auto 0 0;width:min(88vw,370px);background:#040b0a;transform:translateX(-102%);transition:transform .12s ease-out;padding:max(18px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;padding:0 4px 12px}
.drawer-head strong{font-size:13px;font-weight:570;letter-spacing:.08em}
.drawer-head .icon{margin-left:auto}
.tree{overflow:auto;padding:4px 0}
.project{margin:2px 0 12px}
.project-row,.chat-row{width:100%;display:flex;align-items:center;text-align:left;border-radius:14px}
.project-row{padding:10px 10px;font-weight:570;color:#b8d8d4}
.project-row.active{background:#081714;color:#f0fffd}
.project-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#6c9994}
.mini svg{width:17px;height:17px}
.chats{padding:2px 0 0 12px}
.chat-row{padding:9px 12px;color:#709b96;font-size:13px}
.chat-row.active{color:#e1fffb;background:#07120f}
.chat-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#voiceLive{position:fixed;inset:0;z-index:100;display:none;background:radial-gradient(circle at 50% 42%,rgba(0,255,235,.06),transparent 34rem),#010504}
#voiceLive.open{display:grid;grid-template-rows:auto 1fr auto}
.voice-top{height:64px;display:flex;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 8px}
.voice-top .brand{margin-right:auto}
.voice-grid{min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:10px;padding:0 16px 10px}
.voice-stage{position:relative;display:grid;place-items:center;min-height:0}
.orb-wrap{width:min(70vmin,620px);aspect-ratio:1;display:grid;place-items:center}
.orb{width:100%;overflow:visible;transform:scale(var(--voice-scale,1));will-change:transform}
.voice-ring-fill{fill:rgba(0,32,29,.12)}
.voice-ring-line{fill:none;stroke:var(--cyan);stroke-width:2.5;filter:drop-shadow(0 0 4px #19fff0) drop-shadow(0 0 14px rgba(25,255,240,.6));stroke-linecap:round;stroke-linejoin:round}
.voice-state{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);color:#5f8c87;font-size:12px;white-space:nowrap}
.voice-chat{min-height:0;overflow:auto;padding:18px 8px 18px 18px;scrollbar-width:none}
.voice-chat::-webkit-scrollbar{display:none}
.voice-controls{display:flex;justify-content:center;gap:16px;padding:8px 16px max(20px,env(safe-area-inset-bottom))}
.voice-controls .icon{width:58px;height:58px;background:#071714;color:#75fff5}
.voice-controls .end{background:#251013;color:#ff7e8e}
@media(max-width:720px){
  .topbar{height:58px;padding-left:10px;padding-right:10px}
  .messages{padding:18px 12px 130px}
  .bubble{max-width:88%}
  .voice-grid{grid-template-columns:1fr;grid-template-rows:minmax(0,58svh) minmax(0,1fr);padding:0 8px}
  .voice-chat{padding:2px 16px 10px}
  .orb-wrap{width:min(92vw,520px)}
}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <button id="projectsBtn" class="icon" type="button" aria-label="Proyectos">
      <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3Z"/><path d="M3 7V5h7l2 2"/></svg>
    </button>
    <div class="brand">0liviA</div>
    <div id="chatTitle" class="chat-title"></div>
    <span id="coreDot" class="core-dot" title="Core pendiente"></span>
    <button id="voiceBtn" class="icon" type="button" aria-label="Live Voice">
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
    </button>
  </header>
  <section id="messages" class="messages" aria-live="polite"></section>
  <form id="composer" class="composer-wrap">
    <div class="composer">
      <input id="text" autocomplete="off" placeholder="Escribile a 0liviA…" aria-label="Mensaje">
      <button id="send" class="send" type="submit" aria-label="Enviar">
        <svg id="sendIcon" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
      </button>
    </div>
  </form>
</main>

<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <strong>PROYECTOS</strong>
    <button id="newProject" class="icon" type="button" aria-label="Nuevo proyecto">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div id="tree" class="tree"></div>
</aside>

<section id="voiceLive" aria-hidden="true">
  <div class="voice-top">
    <div class="brand">0liviA</div>
    <button id="voiceClose" class="icon" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="voice-grid">
    <div class="voice-stage">
      <div class="orb-wrap" aria-hidden="true">
        <svg class="orb" viewBox="0 0 240 240">
          <path id="voiceRingFill" class="voice-ring-fill"></path>
          <path id="voiceRingPath" class="voice-ring-line"></path>
        </svg>
      </div>
      <div id="voiceState" class="voice-state"></div>
    </div>
    <div id="voiceChat" class="voice-chat"></div>
  </div>
  <div class="voice-controls">
    <button id="voiceMain" class="icon" type="button" aria-label="Micrófono">
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
    </button>
    <button id="voiceEnd" class="icon end" type="button" aria-label="Finalizar">
      <svg viewBox="0 0 24 24"><path d="M5 15c4-4 10-4 14 0"/><path d="M8 13l-2-3M16 13l2-3"/></svg>
    </button>
  </div>
</section>

<script>
const DB_NAME='olivia-ui-v2';
const STORE='state';
const STATE_KEY='workspace';
let workspace=null;
let coreOnline=false;
let controller=null;
let turnId=null;
let syncing=false;
let voiceStream=null,voiceMuted=false,voiceRecognition=null,voiceRecognitionStarting=false,voiceSpeaking=false;
let voiceAudioContext=null,voiceAnalyser=null,voiceSource=null,voiceRaf=0,speechRaf=0,speechPulse=0;

const $=s=>document.querySelector(s);
const messagesEl=$('#messages');
const treeEl=$('#tree');
const chatTitleEl=$('#chatTitle');
const coreDot=$('#coreDot');
const drawer=$('#drawer');
const backdrop=$('#drawerBackdrop');
const textInput=$('#text');
const sendBtn=$('#send');
const voiceLive=$('#voiceLive');
const voiceChat=$('#voiceChat');
const voiceState=$('#voiceState');
const voiceRingPath=$('#voiceRingPath');
const voiceRingFill=$('#voiceRingFill');
const voiceOrb=$('.orb');

function uid(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function now(){return Date.now()}

function openDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(STORE);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function readState(){
  const db=await openDb();
  return await new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).get(STATE_KEY);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
async function saveState(){
  const db=await openDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(workspace,STATE_KEY);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}
function blankWorkspace(){
  const projectId=uid('p');
  const chatId=uid('c');
  return {
    selectedProjectId:projectId,
    selectedChatId:chatId,
    projects:[{id:projectId,name:'0liviA',chats:[{id:chatId,title:'Nuevo chat',remoteSessionId:null,messages:[]}]}]
  };
}
function selectedProject(){
  return workspace.projects.find(p=>p.id===workspace.selectedProjectId)||workspace.projects[0];
}
function selectedChat(){
  const p=selectedProject();
  return p&&p.chats.find(c=>c.id===workspace.selectedChatId)||p&&p.chats[0];
}
function escapeText(value){return String(value||'')}

function setCoreState(mode){
  coreOnline=mode==='online';
  coreDot.className='core-dot'+(mode==='online'?' online':mode==='locked'?' locked':'');
  coreDot.title=mode==='online'?'Core online':mode==='locked'?'Core bloqueado':'Core pendiente';
}
async function probeCore(){
  try{
    const r=await fetch('/healthz',{cache:'no-store'});
    const type=(r.headers.get('content-type')||'').toLowerCase();
    if(!r.ok||!type.includes('application/json'))throw new Error('offline');
    const body=await r.json();
    if(body.process_alive!==true)throw new Error('offline');
    setCoreState(body.provider_ready?'online':'locked');
    return body.provider_ready===true;
  }catch(e){
    setCoreState('offline');
    return false;
  }
}

function renderMessagesInto(root,chat){
  root.textContent='';
  if(!chat||!chat.messages.length){
    const e=document.createElement('div');
    e.className='empty';
    e.textContent='0liviA';
    root.appendChild(e);
    return;
  }
  for(const m of chat.messages){
    const row=document.createElement('div');
    row.className='msg '+m.role+(m.status==='queued'?' pending':'');
    if(m.status==='queued'&&m.role==='user'){
      const mark=document.createElement('span');
      mark.className='pending-mark';
      row.appendChild(mark);
    }
    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.textContent=escapeText(m.text);
    row.appendChild(bubble);
    root.appendChild(row);
  }
  root.scrollTop=root.scrollHeight;
}
function renderMessages(){
  const chat=selectedChat();
  chatTitleEl.textContent=chat&&chat.title!=='Nuevo chat'?chat.title:'';
  renderMessagesInto(messagesEl,chat);
  renderMessagesInto(voiceChat,chat);
}
function projectButton(project){
  const wrap=document.createElement('div');
  wrap.className='project';
  const row=document.createElement('button');
  row.type='button';
  row.className='project-row'+(project.id===workspace.selectedProjectId?' active':'');
  const icon=document.createElement('span');
  icon.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3Z"/></svg>';
  icon.className='mini';
  const name=document.createElement('span');
  name.className='project-name';
  name.textContent=project.name;
  const add=document.createElement('span');
  add.className='mini';
  add.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>';
  add.title='Nuevo chat';
  row.append(icon,name,add);
  row.onclick=async e=>{
    if(e.target.closest('.mini:last-child')){
      const chat={id:uid('c'),title:'Nuevo chat',remoteSessionId:null,messages:[]};
      project.chats.unshift(chat);
      workspace.selectedProjectId=project.id;
      workspace.selectedChatId=chat.id;
      await saveState();
      renderAll();
      closeDrawer();
      return;
    }
    workspace.selectedProjectId=project.id;
    workspace.selectedChatId=project.chats[0]?.id||null;
    await saveState();
    renderAll();
  };
  wrap.appendChild(row);

  if(project.id===workspace.selectedProjectId){
    const chats=document.createElement('div');
    chats.className='chats';
    for(const chat of project.chats){
      const cr=document.createElement('button');
      cr.type='button';
      cr.className='chat-row'+(chat.id===workspace.selectedChatId?' active':'');
      const span=document.createElement('span');
      span.textContent=chat.title;
      cr.appendChild(span);
      cr.onclick=async()=>{
        workspace.selectedChatId=chat.id;
        await saveState();
        renderAll();
        closeDrawer();
      };
      chats.appendChild(cr);
    }
    wrap.appendChild(chats);
  }
  return wrap;
}
function renderTree(){
  treeEl.textContent='';
  for(const p of workspace.projects)treeEl.appendChild(projectButton(p));
}
function renderAll(){renderTree();renderMessages()}

function openDrawer(){drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false')}
function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true')}
$('#projectsBtn').onclick=openDrawer;
backdrop.onclick=closeDrawer;
$('#newProject').onclick=async()=>{
  const raw=prompt('Nombre del proyecto');
  const name=(raw||'').trim();
  if(!name)return;
  const chat={id:uid('c'),title:'Nuevo chat',remoteSessionId:null,messages:[]};
  const p={id:uid('p'),name:name.slice(0,60),chats:[chat]};
  workspace.projects.unshift(p);
  workspace.selectedProjectId=p.id;
  workspace.selectedChatId=chat.id;
  await saveState();
  renderAll();
  closeDrawer();
};

async function ensureRemoteSession(chat){
  if(chat.remoteSessionId)return chat.remoteSessionId;
  const r=await fetch('/api/sessions',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:chat.title||'Chat'})
  });
  if(r.status===401){setCoreState('locked');throw new Error('locked')}
  const type=(r.headers.get('content-type')||'').toLowerCase();
  if(!r.ok||!type.includes('application/json'))throw new Error('offline');
  const body=await r.json();
  chat.remoteSessionId=body.id;
  await saveState();
  return body.id;
}
async function sendRemote(chat,userMessage,speak){
  const session=await ensureRemoteSession(chat);
  controller=new AbortController();
  turnId=null;
  setSendMode(true);
  let assistant=null;
  try{
    const r=await fetch('/api/chat/'+encodeURIComponent(session),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:userMessage.text}),
      signal:controller.signal
    });
    if(r.status===401){setCoreState('locked');throw new Error('locked')}
    if(!r.ok)throw new Error('offline');
    if(!(r.headers.get('content-type')||'').toLowerCase().includes('text/event-stream'))throw new Error('offline');
    turnId=r.headers.get('X-Turn-ID');
    const reader=r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer='',answer='';
    while(true){
      const part=await reader.read();
      if(part.done)break;
      buffer+=part.value;
      const lines=buffer.split('\n');
      buffer=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const ev=JSON.parse(line.slice(6));
        if(ev.type==='delta'){
          answer+=ev.text||'';
          if(!assistant){
            assistant={id:uid('m'),role:'assistant',text:'',status:'synced',ts:now()};
            chat.messages.push(assistant);
          }
          assistant.text=answer;
          renderMessages();
        }
        if(ev.type==='error')throw new Error(ev.code||ev.error||'provider');
      }
    }
    userMessage.status='synced';
    if(assistant&&speak)await speakEsAr(assistant.text);
    await saveState();
    renderMessages();
    return true;
  }finally{
    controller=null;
    turnId=null;
    setSendMode(false);
  }
}
function setSendMode(active){
  sendBtn.classList.toggle('stop',active);
  sendBtn.type=active?'button':'submit';
  sendBtn.setAttribute('aria-label',active?'Cancelar':'Enviar');
  $('#sendIcon').innerHTML=active?'<rect x="7" y="7" width="10" height="10" rx="1"/>':'<path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/>';
}
sendBtn.onclick=async e=>{
  if(controller){
    e.preventDefault();
    controller.abort();
  }
};
async function sendChat(raw,{speak=false}={}){
  const value=(raw||'').trim();
  if(!value)return;
  const chat=selectedChat();
  if(!chat)return;
  const msg={id:uid('m'),role:'user',text:value,status:'queued',ts:now()};
  chat.messages.push(msg);
  if(chat.title==='Nuevo chat')chat.title=value.replace(/\s+/g,' ').slice(0,42);
  await saveState();
  renderAll();

  const ready=coreOnline||await probeCore();
  if(!ready)return;
  try{
    await sendRemote(chat,msg,speak);
  }catch(e){
    msg.status='queued';
    await saveState();
    renderMessages();
  }
}
$('#composer').onsubmit=async e=>{
  e.preventDefault();
  if(controller)return;
  const value=textInput.value.trim();
  if(!value)return;
  textInput.value='';
  await sendChat(value);
};

async function syncQueued(){
  if(syncing||controller)return;
  const ready=await probeCore();
  if(!ready)return;
  syncing=true;
  try{
    for(const p of workspace.projects){
      for(const c of p.chats){
        for(const m of c.messages.filter(x=>x.role==='user'&&x.status==='queued')){
          try{await sendRemote(c,m,false)}catch(e){return}
        }
      }
    }
  }finally{syncing=false}
}

const RING_POINTS=72,RING_CENTER=120,RING_RADIUS=88;
function ringCurve(points){
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const first=mid(points[points.length-1],points[0]);
  let d='M '+first[0].toFixed(2)+' '+first[1].toFixed(2);
  for(let i=0;i<points.length;i++){
    const p=points[i],n=points[(i+1)%points.length],m=mid(p,n);
    d+=' Q '+p[0].toFixed(2)+' '+p[1].toFixed(2)+' '+m[0].toFixed(2)+' '+m[1].toFixed(2);
  }
  return d+' Z';
}
function drawRing(freq=null,energy=0,phase=0){
  const pts=[];
  for(let i=0;i<RING_POINTS;i++){
    const angle=Math.PI*2*i/RING_POINTS-Math.PI/2;
    let s=0;
    if(freq&&freq.length){
      const idx=Math.min(freq.length-1,Math.floor(i/RING_POINTS*Math.min(freq.length,96)));
      s=(freq[idx]+freq[Math.min(freq.length-1,idx+2)])/510;
    }else if(energy>0){
      s=Math.max(0,Math.min(1,.42+.3*Math.sin(i/RING_POINTS*Math.PI*6+phase)+.18*Math.sin(i/RING_POINTS*Math.PI*14-phase*.7)));
    }
    const r=RING_RADIUS+(energy?Math.pow(s,1.2)*18*energy:0);
    pts.push([RING_CENTER+Math.cos(angle)*r,RING_CENTER+Math.sin(angle)*r]);
  }
  const d=ringCurve(pts);
  voiceRingPath.setAttribute('d',d);
  voiceRingFill.setAttribute('d',d);
  voiceOrb.style.setProperty('--voice-scale',(1+energy*.035).toFixed(4));
}
function stopMeter(reset=true){
  if(voiceRaf)cancelAnimationFrame(voiceRaf);
  voiceRaf=0;
  try{voiceSource?.disconnect()}catch(e){}
  try{voiceAnalyser?.disconnect()}catch(e){}
  if(voiceAudioContext)voiceAudioContext.close().catch(()=>{});
  voiceSource=voiceAnalyser=voiceAudioContext=null;
  if(reset)drawRing();
}
function startMeter(stream){
  stopMeter(false);
  voiceAudioContext=new (window.AudioContext||window.webkitAudioContext)();
  voiceAnalyser=voiceAudioContext.createAnalyser();
  voiceAnalyser.fftSize=512;
  voiceAnalyser.smoothingTimeConstant=.76;
  voiceSource=voiceAudioContext.createMediaStreamSource(stream);
  voiceSource.connect(voiceAnalyser);
  const td=new Uint8Array(voiceAnalyser.fftSize),fd=new Uint8Array(voiceAnalyser.frequencyBinCount);
  const tick=()=>{
    if(!voiceAnalyser||!voiceStream||voiceSpeaking)return;
    voiceAnalyser.getByteTimeDomainData(td);
    voiceAnalyser.getByteFrequencyData(fd);
    let sum=0;
    for(const v of td){const x=(v-128)/128;sum+=x*x}
    const e=Math.min(1,Math.max(0,(Math.sqrt(sum/td.length)-.009)*9.8));
    drawRing(voiceMuted?null:fd,voiceMuted?0:e);
    voiceRaf=requestAnimationFrame(tick);
  };
  tick();
}
function recognitionCtor(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
function stopRecognition(){
  if(!voiceRecognition)return;
  try{voiceRecognition.onend=null;voiceRecognition.stop()}catch(e){}
  voiceRecognition=null;voiceRecognitionStarting=false;
}
function startRecognition(){
  if(voiceRecognition||voiceRecognitionStarting||voiceMuted||voiceSpeaking||controller)return;
  const Ctor=recognitionCtor();
  if(!Ctor){voiceState.textContent='es-AR no disponible';return}
  voiceRecognitionStarting=true;
  const rec=new Ctor();
  rec.lang='es-AR';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
  voiceRecognition=rec;
  rec.onstart=()=>{voiceRecognitionStarting=false;voiceState.textContent='●'};
  rec.onresult=async ev=>{
    let interim='',final='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0]?.transcript||'';
      if(ev.results[i].isFinal)final+=t;else interim+=t;
    }
    voiceState.textContent=(final||interim).trim().slice(0,80);
    if(final.trim()){
      rec.onend=null;try{rec.stop()}catch(e){}
      voiceRecognition=null;voiceRecognitionStarting=false;
      await sendChat(final.trim(),{speak:true});
    }
  };
  rec.onerror=()=>{voiceRecognition=null;voiceRecognitionStarting=false;voiceState.textContent=''};
  rec.onend=()=>{voiceRecognition=null;voiceRecognitionStarting=false;if(voiceLive.classList.contains('open')&&!voiceMuted&&!controller)setTimeout(startRecognition,250)};
  try{rec.start()}catch(e){voiceRecognition=null;voiceRecognitionStarting=false}
}
function exactArgentineVoice(){
  if(!('speechSynthesis' in window))return null;
  return speechSynthesis.getVoices().find(v=>(v.lang||'').toLowerCase().replace('_','-')==='es-ar')||null;
}
async function speakEsAr(value){
  if(!('speechSynthesis' in window))return false;
  stopRecognition();speechSynthesis.cancel();
  let voice=exactArgentineVoice();
  if(!voice){
    await new Promise(resolve=>{const t=setTimeout(resolve,700);speechSynthesis.addEventListener('voiceschanged',()=>{clearTimeout(t);resolve()},{once:true})});
    voice=exactArgentineVoice();
  }
  if(!voice){voiceState.textContent='';setTimeout(startRecognition,250);return false}
  return await new Promise(resolve=>{
    const u=new SpeechSynthesisUtterance(value);
    u.lang='es-AR';u.voice=voice;u.rate=1;u.pitch=1;
    u.onstart=()=>{voiceSpeaking=true;stopMeter(false);voiceState.textContent='0liviA'};
    u.onboundary=()=>{speechPulse=1};
    let phase=0;
    const pulse=()=>{
      if(!voiceSpeaking)return;
      phase+=.14;speechPulse=Math.max(.18,speechPulse*.91);
      drawRing(null,Math.min(1,.3+speechPulse*.7),phase);
      speechRaf=requestAnimationFrame(pulse);
    };
    u.onstart=()=>{voiceSpeaking=true;stopMeter(false);voiceState.textContent='0liviA';pulse()};
    const done=()=>{voiceSpeaking=false;if(speechRaf)cancelAnimationFrame(speechRaf);speechRaf=0;drawRing();if(voiceStream&&!voiceMuted)startMeter(voiceStream);voiceState.textContent='';setTimeout(startRecognition,250);resolve(true)};
    u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  });
}
function closeVoice(){
  stopRecognition();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  voiceSpeaking=false;
  stopMeter();
  if(voiceStream){voiceStream.getTracks().forEach(t=>t.stop());voiceStream=null}
  voiceMuted=false;voiceState.textContent='';
  voiceLive.classList.remove('open');voiceLive.setAttribute('aria-hidden','true');
}
$('#voiceBtn').onclick=()=>{voiceLive.classList.add('open');voiceLive.setAttribute('aria-hidden','false');renderMessagesInto(voiceChat,selectedChat());drawRing()};
$('#voiceClose').onclick=closeVoice;
$('#voiceEnd').onclick=closeVoice;
$('#voiceMain').onclick=async()=>{
  if(voiceSpeaking){
    speechSynthesis.cancel();voiceSpeaking=false;drawRing();startRecognition();return;
  }
  if(!voiceStream){
    try{
      voiceStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      voiceMuted=false;startMeter(voiceStream);startRecognition();
    }catch(e){voiceState.textContent='micrófono bloqueado'}
    return;
  }
  voiceMuted=!voiceMuted;
  voiceStream.getAudioTracks().forEach(t=>t.enabled=!voiceMuted);
  if(voiceMuted){stopRecognition();drawRing();voiceState.textContent=''}
  else{startMeter(voiceStream);startRecognition()}
};

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();if(voiceLive.classList.contains('open'))closeVoice()}});
window.addEventListener('online',syncQueued);
window.addEventListener('focus',syncQueued);
setInterval(syncQueued,15000);

(async()=>{
  try{workspace=await readState()}catch(e){workspace=null}
  if(!workspace||!Array.isArray(workspace.projects)||!workspace.projects.length)workspace=blankWorkspace();
  const p=selectedProject();
  if(!p.chats.length)p.chats.push({id:uid('c'),title:'Nuevo chat',remoteSessionId:null,messages:[]});
  if(!workspace.selectedChatId)workspace.selectedChatId=p.chats[0].id;
  await saveState();
  renderAll();
  await probeCore();
  syncQueued();
})();
</script>
