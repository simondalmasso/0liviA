<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>0liviA</title>
<style>
:root{
  color-scheme:dark;
  --bg:#020706;
  --panel:#06100f;
  --panel2:#081816;
  --line:rgba(25,255,240,.18);
  --text:#e8fffc;
  --muted:#79a6a1;
  --cyan:#19fff0;
  --danger:#ff6477;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 50% 18%,rgba(0,255,235,.045),transparent 32rem),
  var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh}
button,input{font:inherit}
button{cursor:pointer}
.shell{width:min(980px,100%);min-height:100svh;margin:auto;padding:24px 18px 18px;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-size:18px;font-weight:560;letter-spacing:.14em}
.meta{color:var(--muted);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hint{margin:0;color:var(--muted);font-size:13px}
#log{min-height:52svh;padding:20px;border:1px solid var(--line);border-radius:22px;background:rgba(2,12,11,.76);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 20px 70px rgba(0,0,0,.24)}
.row{display:flex;gap:10px}
input{min-width:0;flex:1;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:13px 15px;outline:none}
input:focus{border-color:rgba(25,255,240,.52);box-shadow:0 0 0 3px rgba(25,255,240,.07)}
button{border:1px solid var(--line);border-radius:16px;background:var(--panel2);color:var(--text);padding:12px 16px}
button.primary{background:#0acfc4;color:#00110f;border-color:#19fff0;font-weight:650}
button.secondary{background:#071513}
button.voice-launch{display:inline-flex;align-items:center;gap:9px;background:#061816;border-color:rgba(25,255,240,.32);color:#74fff6}
button:disabled{opacity:.45;cursor:default}
button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Full-screen Live Voice: static UI; only the ring reacts to real audio energy. */
#voiceLive{position:fixed;inset:0;z-index:1000;display:none;overflow:hidden;background:
  radial-gradient(circle at 50% 44%,rgba(0,255,235,.055),transparent 24rem),
  #020706}
#voiceLive.active{display:grid;grid-template-rows:auto 1fr}
.voice-top{display:flex;justify-content:space-between;align-items:center;padding:max(18px,env(safe-area-inset-top)) 24px 8px}
.voice-name{font-size:13px;color:#78b7b3;letter-spacing:.16em;text-transform:uppercase}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;background:rgba(0,28,27,.72);border:1px solid rgba(0,255,235,.32)}
.voice-main{min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:18px;padding:4px 22px 22px}
.voice-stage{position:relative;min-height:0;display:grid;place-items:center;padding:10px 12px 92px}
.orb-wrap{position:relative;width:min(62vw,680px);aspect-ratio:1;display:grid;place-items:center}
.orb-glow{position:absolute;inset:9%;border-radius:50%;background:transparent;box-shadow:
  0 0 56px rgba(0,255,235,.17),
  0 0 110px rgba(0,255,235,.08);
  opacity:1}
.orb{position:relative;width:86%;aspect-ratio:1;overflow:visible;
  transform:scale(var(--voice-scale,1));
  will-change:transform}
.voice-ring-fill{fill:rgba(0,34,31,.14)}
.voice-ring-line{fill:none;stroke:#19fff0;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 3px #19fff0) drop-shadow(0 0 9px rgba(25,255,240,.72))}

.voice-copy{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;width:min(88%,560px);text-align:center;color:#58a7a2;font-size:14px}
.voice-copy strong{display:block;color:#7ffdf4;font-size:17px;font-weight:500;margin-bottom:5px}
.voice-bottom{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center}
.voice-controls{display:flex;gap:18px;align-items:center;background:transparent;border:0;padding:0}
.voice-controls .icon-btn{width:58px;height:58px}
.voice-controls .main-mic{width:68px;height:68px;background:rgba(0,36,34,.82);color:#20fff0;border:1px solid rgba(32,255,240,.68)}
.voice-controls .end-call{color:#ff6477;border-color:rgba(255,100,119,.52);background:rgba(48,7,12,.78)}
.voice-controls svg,.voice-top svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.voice-chat{min-height:0;display:grid;grid-template-rows:1fr auto;gap:12px;padding:12px 0}
.voice-transcript{min-height:0;overflow:auto;border:1px solid rgba(25,255,240,.18);border-radius:22px;background:rgba(1,12,11,.74);padding:18px;color:#cce8e5;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:thin}
.voice-chat-form{display:flex;gap:8px}
.voice-chat-form input{background:#04110f}
.voice-chat-form button{width:48px;padding:0;display:grid;place-items:center;color:#19fff0;background:#041412}
.voice-chat-form svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:620px){
  .shell{padding:18px 12px 12px}
  .row{flex-wrap:wrap}
  .row input{flex-basis:100%}
  #log{min-height:54svh;border-radius:22px}
  .voice-main{grid-template-columns:1fr;grid-template-rows:minmax(330px,58svh) minmax(180px,1fr);padding:0 12px 12px}
  .voice-stage{padding:0 4px 82px}
  .orb-wrap{width:min(94vw,520px)}
  .voice-copy{bottom:78px}
  .voice-chat{padding:0}
  .voice-transcript{border-radius:18px}
}
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand">0liviA</div>
    <span class="meta" id="status">sin sesión</span>
  </header>

  <div class="toolbar">
    <p class="hint">Chat persistente + Live Voice. Tu PC no es parte del runtime.</p>
    <button id="openVoice" class="voice-launch" type="button" aria-label="Abrir Live Voice">
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
      Live Voice
    </button>
  </div>

  <div id="log" aria-live="polite"></div>

  <div class="row">
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Token de acceso">
    <button id="new" type="button">Nueva sesión</button>
  </div>

  <form class="row">
    <input id="text" autocomplete="off" placeholder="Escribile a 0liviA…">
    <button id="send" class="primary">Enviar</button>
    <button id="cancel" class="secondary" type="button" disabled>Cancelar</button>
  </form>
</main>

<section id="voiceLive" data-state="idle" aria-hidden="true">
  <div class="voice-top">
    <div class="voice-name">0liviA · Live</div>
    <span class="meta">es-AR</span>
  </div>

  <div class="voice-main">
    <div class="voice-stage">
      <div class="orb-wrap" aria-hidden="true">
        <div class="orb-glow"></div>
        <svg class="orb" id="voiceOrbSvg" viewBox="0 0 240 240" focusable="false">
          <path id="voiceRingFill" class="voice-ring-fill"></path>
          <path id="voiceRingPath" class="voice-ring-line"></path>
        </svg>
      </div>
      <div class="voice-copy">
        <strong id="voiceHeadline">Live Voice</strong>
        <span id="voiceStatus">Listo.</span>
      </div>
      <div class="voice-bottom">
        <div class="voice-controls">
          <button id="voiceMain" class="icon-btn main-mic" type="button" aria-label="Activar o silenciar micrófono">
            <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
          </button>
          <button id="voiceEnd" class="icon-btn end-call" type="button" aria-label="Finalizar Live Voice">
            <svg viewBox="0 0 24 24"><path d="M5 15c4-4 10-4 14 0"/><path d="M8 13l-2-3M16 13l2-3"/></svg>
          </button>
        </div>
      </div>
    </div>
    <aside class="voice-chat">
      <div id="voiceTranscript" class="voice-transcript" aria-live="polite"></div>
      <form id="voiceChatForm" class="voice-chat-form">
        <input id="voiceText" autocomplete="off" placeholder="Escribile a 0liviA…">
        <button type="submit" aria-label="Enviar mensaje">
          <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
        </button>
      </form>
    </aside>
  </div>
</section>

<script>
let sessionId=null, controller=null, turnId=null, token='', sseBuffer='';
let voiceStream=null, voiceMuted=false;
let voiceAudioContext=null, voiceAnalyser=null, voiceSource=null, voiceRaf=0;
let voiceRecognition=null, voiceRecognitionStarting=false;
let voiceLiveWanted=false, voiceSpeaking=false, speechRaf=0, speechPulse=0;

const log=document.querySelector('#log');
const status=document.querySelector('#status');
const text=document.querySelector('#text');
const sendButton=document.querySelector('#send');
const cancelButton=document.querySelector('#cancel');
const tokenInput=document.querySelector('#token');
const voiceLive=document.querySelector('#voiceLive');
const voiceStatus=document.querySelector('#voiceStatus');
const voiceTranscript=document.querySelector('#voiceTranscript');
const voiceText=document.querySelector('#voiceText');
const voiceRingPath=document.querySelector('#voiceRingPath');
const voiceRingFill=document.querySelector('#voiceRingFill');
const voiceOrb=document.querySelector('.orb');

const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});
const normalizeLocale=value=>(value||'').trim().toLowerCase().replaceAll('_','-');

async function api(url,options={}){
  options.headers={...headers(),...(options.headers||{})};
  const r=await fetch(url,options);
  if(!r.ok)throw new Error(await r.text());
  return r;
}

function syncVoiceTranscript(){
  if(!voiceTranscript)return;
  voiceTranscript.textContent=log.textContent;
  voiceTranscript.scrollTop=voiceTranscript.scrollHeight;
}

function show(role,value){
  log.textContent+=`${role}: ${value}\n\n`;
  log.scrollTop=log.scrollHeight;
  syncVoiceTranscript();
}

async function resume(){
  try{
    if(!sessionId){
      const list=await api('/api/sessions?limit=1');
      const data=await list.json();
      sessionId=data.sessions?.[0]?.id||null;
    }
    if(!sessionId){status.textContent='sin sesión';return;}
    const r=await api(`/api/sessions/${sessionId}/messages`);
    const d=await r.json();
    log.textContent='';
    d.messages.forEach(m=>show(m.role==='user'?'vos':'0liviA',m.content));
    status.textContent='sesión '+sessionId;
  }catch(e){
    status.textContent='token requerido';
  }
}

async function create(){
  const r=await api('/api/sessions',{
    method:'POST',
    body:JSON.stringify({title:'Chat es-AR'})
  });
  const d=await r.json();
  sessionId=d.id;
  log.textContent='';
  syncVoiceTranscript();
  status.textContent='sesión '+sessionId;
}

async function ensureSession(){
  if(sessionId)return true;
  try{
    await create();
    return true;
  }catch(e){
    status.textContent='creá una sesión con un token válido';
    return false;
  }
}

async function cancelActiveTurn(){
  const activeTurn=turnId;
  try{
    if(activeTurn&&sessionId){
      await api(`/api/chat/${sessionId}/cancel`,{
        method:'POST',
        body:JSON.stringify({turn_id:activeTurn})
      });
    }
  }catch(e){}
  finally{
    controller?.abort();
  }
}

async function sendChat(raw,{speak=false}={}){
  const value=(raw||'').trim();
  if(!value)return '';
  if(!(await ensureSession()))return '';

  show('vos',value);
  const beforeAssistant=log.textContent;
  controller=new AbortController();
  turnId=null;
  cancelButton.disabled=false;
  sendButton.disabled=true;

  if(voiceLive.classList.contains('active')){
    setVoiceState('thinking','Pensando','0liviA está respondiendo…');
    stopRecognition();
  }

  let answer='';
  try{
    const r=await api(`/api/chat/${sessionId}`,{
      method:'POST',
      body:JSON.stringify({text:value}),
      signal:controller.signal
    });
    turnId=r.headers.get('X-Turn-ID');
    const reader=r.body.pipeThrough(new TextDecoderStream()).getReader();
    sseBuffer='';

    while(true){
      const {value:chunk,done}=await reader.read();
      if(done)break;
      sseBuffer+=chunk;
      const lines=sseBuffer.split('\n');
      sseBuffer=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const event=JSON.parse(line.slice(6));
        if(event.type==='delta'){
          answer+=event.text||'';
          log.textContent=beforeAssistant+`0liviA: ${answer}`;
          log.scrollTop=log.scrollHeight;
          syncVoiceTranscript();
        }
        if(event.type==='error')throw new Error(event.code||event.error||'error');
      }
    }

    if(sseBuffer.startsWith('data: ')){
      const event=JSON.parse(sseBuffer.slice(6));
      if(event.type==='delta'){
        answer+=event.text||'';
        log.textContent=beforeAssistant+`0liviA: ${answer}`;
      }
    }
    log.textContent+='\n\n';
    syncVoiceTranscript();

    if(speak&&voiceLive.classList.contains('active')&&answer.trim()){
      await speakEsAr(answer.trim());
    }else if(voiceLive.classList.contains('active')){
      setVoiceState('idle','Listo','Tocá el micrófono para seguir.');
      maybeRestartRecognition();
    }
    return answer;
  }catch(e){
    if(e.name==='AbortError'){
      log.textContent+='[turno cancelado]\n\n';
      if(voiceLive.classList.contains('active'))setVoiceState('listening','Te escucho','Turno anterior cancelado.');
    }else{
      log.textContent+=`[error: ${e.message}]\n\n`;
      if(voiceLive.classList.contains('active'))setVoiceState('idle','Error','No pude completar el turno.');
    }
    syncVoiceTranscript();
    return '';
  }finally{
    controller=null;
    turnId=null;
    cancelButton.disabled=true;
    sendButton.disabled=false;
  }
}

tokenInput.addEventListener('input',e=>{
  token=e.target.value;
  sessionId=null;
  resume();
});

document.querySelector('#new').onclick=async()=>{
  try{await create()}catch(e){status.textContent='no autorizado'}
};

cancelButton.onclick=cancelActiveTurn;

document.querySelector('main form').onsubmit=async e=>{
  e.preventDefault();
  const value=text.value.trim();
  if(!value)return;
  text.value='';
  await sendChat(value,{speak:false});
};

function setVoiceState(state,headline,copy){
  voiceLive.dataset.state=state;
  document.querySelector('#voiceHeadline').textContent=headline;
  voiceStatus.textContent=copy;
}

const RING_POINTS=72;
const RING_CENTER=120;
const RING_RADIUS=88;

function ringCurve(points){
  if(!points.length)return '';
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const firstMid=mid(points[points.length-1],points[0]);
  let d='M '+firstMid[0].toFixed(2)+' '+firstMid[1].toFixed(2);
  for(let i=0;i<points.length;i++){
    const p=points[i],next=points[(i+1)%points.length],m=mid(p,next);
    d+=' Q '+p[0].toFixed(2)+' '+p[1].toFixed(2)+' '+m[0].toFixed(2)+' '+m[1].toFixed(2);
  }
  return d+' Z';
}

function drawVoiceRing(freqData=null,energy=0,phase=0){
  const points=[];
  for(let i=0;i<RING_POINTS;i++){
    const angle=(Math.PI*2*i/RING_POINTS)-Math.PI/2;
    let spectrum=0;
    if(freqData&&freqData.length){
      const idx=Math.min(freqData.length-1,Math.floor((i/RING_POINTS)*Math.min(freqData.length,96)));
      const a=freqData[idx]/255;
      const b=freqData[Math.min(freqData.length-1,idx+2)]/255;
      spectrum=(a+b)*.5;
    }else if(energy>0){
      spectrum=.42+.32*Math.sin((i/RING_POINTS)*Math.PI*6+phase)+.18*Math.sin((i/RING_POINTS)*Math.PI*14-phase*.7);
      spectrum=Math.max(0,Math.min(1,spectrum));
    }
    const delta=energy>0?Math.pow(spectrum,1.25)*18*energy:0;
    const radius=RING_RADIUS+delta;
    points.push([
      RING_CENTER+Math.cos(angle)*radius,
      RING_CENTER+Math.sin(angle)*radius
    ]);
  }
  const d=ringCurve(points);
  voiceRingPath.setAttribute('d',d);
  voiceRingFill.setAttribute('d',d);
  voiceOrb.style.setProperty('--voice-scale',(1+energy*.035).toFixed(4));
  voiceRingPath.style.strokeWidth=(2.4+energy*1.15).toFixed(2);
  voiceRingPath.style.opacity=(.86+energy*.14).toFixed(3);
}

function setOrbEnergy(raw,freqData=null){
  const e=Math.max(0,Math.min(1,raw));
  drawVoiceRing(freqData,e);
}

drawVoiceRing();

function startVoiceMeter(stream){
  stopVoiceMeter(false);
  voiceAudioContext=new (window.AudioContext||window.webkitAudioContext)();
  voiceAnalyser=voiceAudioContext.createAnalyser();
  voiceAnalyser.fftSize=512;
  voiceAnalyser.smoothingTimeConstant=.78;
  voiceSource=voiceAudioContext.createMediaStreamSource(stream);
  voiceSource.connect(voiceAnalyser);
  const timeData=new Uint8Array(voiceAnalyser.fftSize);
  const freqData=new Uint8Array(voiceAnalyser.frequencyBinCount);

  const tick=()=>{
    if(!voiceAnalyser||!voiceStream||voiceSpeaking)return;
    voiceAnalyser.getByteTimeDomainData(timeData);
    voiceAnalyser.getByteFrequencyData(freqData);
    let sum=0;
    for(let i=0;i<timeData.length;i++){
      const x=(timeData[i]-128)/128;
      sum+=x*x;
    }
    const rms=Math.sqrt(sum/timeData.length);
    const energy=Math.min(1,Math.max(0,(rms-.009)*9.8));
    setOrbEnergy(voiceMuted?0:energy,voiceMuted?null:freqData);
    voiceRaf=requestAnimationFrame(tick);
  };
  tick();
}

function stopVoiceMeter(reset=true){
  if(voiceRaf)cancelAnimationFrame(voiceRaf);
  voiceRaf=0;
  try{voiceSource?.disconnect()}catch(e){}
  try{voiceAnalyser?.disconnect()}catch(e){}
  if(voiceAudioContext)voiceAudioContext.close().catch(()=>{});
  voiceSource=null;
  voiceAnalyser=null;
  voiceAudioContext=null;
  if(reset)drawVoiceRing();
}

function startSpeechRing(){
  if(speechRaf)cancelAnimationFrame(speechRaf);
  let phase=0;
  const tick=()=>{
    if(!voiceSpeaking){
      speechRaf=0;
      drawVoiceRing();
      return;
    }
    phase+=.14;
    speechPulse=Math.max(.16,speechPulse*.91);
    drawVoiceRing(null,Math.min(1,.28+speechPulse*.72),phase);
    speechRaf=requestAnimationFrame(tick);
  };
  tick();
}

function stopSpeechRing(){
  voiceSpeaking=false;
  speechPulse=0;
  if(speechRaf)cancelAnimationFrame(speechRaf);
  speechRaf=0;
  drawVoiceRing();
  if(voiceStream&&!voiceMuted)startVoiceMeter(voiceStream);
}

function stopRecognition(){
  if(!voiceRecognition)return;
  try{
    voiceRecognition.onend=null;
    voiceRecognition.stop();
  }catch(e){}
  voiceRecognition=null;
  voiceRecognitionStarting=false;
}

function recognitionCtor(){
  return window.SpeechRecognition||window.webkitSpeechRecognition||null;
}

function maybeRestartRecognition(){
  if(!voiceLiveWanted||!voiceStream||voiceMuted||voiceSpeaking||controller)return;
  setTimeout(()=>startRecognition(),220);
}

function startRecognition(){
  if(voiceRecognition||voiceRecognitionStarting||!voiceLiveWanted||voiceMuted||voiceSpeaking||controller)return;
  const Ctor=recognitionCtor();
  if(!Ctor){
    setVoiceState('idle','Texto disponible','Este navegador no ofrece reconocimiento de voz es-AR.');
    return;
  }

  voiceRecognitionStarting=true;
  const rec=new Ctor();
  rec.lang='es-AR';
  rec.continuous=false;
  rec.interimResults=true;
  rec.maxAlternatives=1;
  voiceRecognition=rec;

  rec.onstart=()=>{
    voiceRecognitionStarting=false;
    setVoiceState('listening','Te escucho','Micrófono activo · es-AR');
  };

  rec.onresult=async event=>{
    let interim='',final='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const part=event.results[i][0]?.transcript||'';
      if(event.results[i].isFinal)final+=part;
      else interim+=part;
    }
    const preview=(final||interim).trim();
    if(preview)setVoiceState('listening','Te escucho',preview);
    if(final.trim()){
      rec.onend=null;
      try{rec.stop()}catch(e){}
      voiceRecognition=null;
      voiceRecognitionStarting=false;
      await sendChat(final.trim(),{speak:true});
    }
  };

  rec.onerror=event=>{
    const fatal=['not-allowed','service-not-allowed','audio-capture'];
    if(fatal.includes(event.error)){
      voiceLiveWanted=false;
      setVoiceState('idle','Micrófono bloqueado','Revisá el permiso de micrófono del navegador.');
    }else if(event.error!=='no-speech'){
      setVoiceState('idle','Voz interrumpida',event.error||'error de reconocimiento');
    }
  };

  rec.onend=()=>{
    voiceRecognition=null;
    voiceRecognitionStarting=false;
    maybeRestartRecognition();
  };

  try{
    rec.start();
  }catch(e){
    voiceRecognition=null;
    voiceRecognitionStarting=false;
    setVoiceState('idle','Voz no disponible','No pude iniciar reconocimiento es-AR.');
  }
}

function exactArgentineVoice(){
  if(!('speechSynthesis' in window))return null;
  return speechSynthesis.getVoices().find(v=>normalizeLocale(v.lang)==='es-ar')||null;
}

async function speakEsAr(value){
  if(!('speechSynthesis' in window)){
    setVoiceState('idle','Texto disponible','Este navegador no ofrece síntesis de voz.');
    maybeRestartRecognition();
    return false;
  }

  stopRecognition();
  speechSynthesis.cancel();

  let voice=exactArgentineVoice();
  if(!voice){
    await new Promise(resolve=>{
      let done=false;
      const finish=()=>{if(done)return;done=true;resolve()};
      const timer=setTimeout(finish,900);
      speechSynthesis.addEventListener('voiceschanged',()=>{clearTimeout(timer);finish()},{once:true});
    });
    voice=exactArgentineVoice();
  }

  if(!voice){
    setVoiceState('idle','Sin voz es-AR','La respuesta quedó en texto; no uso una voz genérica.');
    maybeRestartRecognition();
    return false;
  }

  return await new Promise(resolve=>{
    const utterance=new SpeechSynthesisUtterance(value);
    utterance.lang='es-AR';
    utterance.voice=voice;
    utterance.rate=1;
    utterance.pitch=1;

    utterance.onstart=()=>{
      voiceSpeaking=true;
      speechPulse=.45;
      stopVoiceMeter(false);
      setVoiceState('speaking','0liviA','Hablando · '+voice.name);
      startSpeechRing();
    };
    utterance.onboundary=()=>{
      speechPulse=1;
    };
    utterance.onend=()=>{
      stopSpeechRing();
      setVoiceState('listening','Te escucho','Micrófono activo · es-AR');
      maybeRestartRecognition();
      resolve(true);
    };
    utterance.onerror=()=>{
      stopSpeechRing();
      setVoiceState('idle','Voz interrumpida','La respuesta quedó disponible en texto.');
      maybeRestartRecognition();
      resolve(false);
    };

    speechSynthesis.speak(utterance);
  });
}

function stopLocalMic(){
  stopRecognition();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  stopSpeechRing();
  stopVoiceMeter();
  if(voiceStream){
    voiceStream.getTracks().forEach(t=>t.stop());
    voiceStream=null;
  }
  voiceMuted=false;
}

function closeVoice(){
  voiceLiveWanted=false;
  stopLocalMic();
  voiceLive.classList.remove('active');
  voiceLive.setAttribute('aria-hidden','true');
  setVoiceState('idle','Live Voice','Listo.');
}

document.querySelector('#openVoice').onclick=()=>{
  voiceLiveWanted=true;
  voiceLive.classList.add('active');
  voiceLive.setAttribute('aria-hidden','false');
  setVoiceState('idle','Live Voice','Tocá el micrófono para empezar.');
  syncVoiceTranscript();
  drawVoiceRing();
};

document.querySelector('#voiceEnd').onclick=closeVoice;

document.querySelector('#voiceChatForm').onsubmit=async e=>{
  e.preventDefault();
  const value=voiceText.value.trim();
  if(!value)return;
  voiceText.value='';
  await sendChat(value,{speak:true});
};

document.querySelector('#voiceMain').onclick=async()=>{
  if(voiceSpeaking){
    if('speechSynthesis' in window)speechSynthesis.cancel();
    stopSpeechRing();
    await cancelActiveTurn();
    voiceMuted=false;
    setVoiceState('listening','Te escucho','Interrumpiste a 0liviA.');
    maybeRestartRecognition();
    return;
  }

  if(!voiceStream){
    try{
      voiceStream=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
      });
      voiceMuted=false;
      voiceStream.getAudioTracks().forEach(t=>t.enabled=true);
      startVoiceMeter(voiceStream);
      voiceLiveWanted=true;
      startRecognition();
    }catch(e){
      setVoiceState('idle','Micrófono bloqueado','Dale permiso al navegador para usar Live Voice.');
    }
    return;
  }

  voiceMuted=!voiceMuted;
  voiceStream.getAudioTracks().forEach(t=>t.enabled=!voiceMuted);
  if(voiceMuted){
    stopRecognition();
    drawVoiceRing();
  }else{
    startVoiceMeter(voiceStream);
    startRecognition();
  }
  setVoiceState(
    voiceMuted?'idle':'listening',
    voiceMuted?'Silenciado':'Te escucho',
    voiceMuted?'Tocá el micrófono para volver':'Micrófono activo · es-AR'
  );
};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&voiceLive.classList.contains('active'))closeVoice();
});
</script>
