<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>0liviA</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070a12;
  --panel:#0d1321;
  --panel2:#121a2c;
  --line:rgba(255,255,255,.10);
  --text:#f5f7fb;
  --muted:#919caf;
  --cyan:#69e7ff;
  --blue:#6d87ff;
  --violet:#8a66ff;
  --pink:#ff66d1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 50% -10%,rgba(89,104,255,.16),transparent 34rem),
  var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh}
button,input{font:inherit}
button{cursor:pointer}
.shell{width:min(900px,100%);min-height:100svh;margin:auto;padding:24px 18px 18px;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-size:20px;font-weight:670;letter-spacing:-.03em}
.meta{color:var(--muted);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hint{margin:0;color:var(--muted);font-size:13px}
#log{min-height:52svh;padding:20px;border:1px solid var(--line);border-radius:26px;background:
  linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),
  rgba(9,14,25,.72);backdrop-filter:blur(16px);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 28px 90px rgba(0,0,0,.30)}
.row{display:flex;gap:10px}
input{min-width:0;flex:1;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:13px 15px;outline:none}
input:focus{border-color:rgba(105,231,255,.48);box-shadow:0 0 0 3px rgba(105,231,255,.08)}
button{border:1px solid var(--line);border-radius:18px;background:var(--panel2);color:var(--text);padding:12px 16px}
button.primary{background:linear-gradient(135deg,#4562ff,#765cff);border-color:transparent}
button.secondary{background:#182133}
button.voice-launch{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,rgba(105,231,255,.12),rgba(138,102,255,.16));border-color:rgba(123,150,255,.25)}
button:disabled{opacity:.45;cursor:default}
button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Full-screen Live Voice: dark field + luminous cyan/blue/violet/pink orb */
#voiceLive{position:fixed;inset:0;z-index:1000;display:none;overflow:hidden;background:
  radial-gradient(circle at 50% 44%,rgba(57,86,166,.18),transparent 26rem),
  radial-gradient(circle at 50% 10%,rgba(58,69,123,.17),transparent 32rem),
  #070a12}
#voiceLive.active{display:grid;grid-template-rows:auto 1fr auto}
.voice-top{display:flex;justify-content:space-between;align-items:center;padding:max(18px,env(safe-area-inset-top)) 22px 12px}
.voice-name{font-size:14px;color:#c8d0df;letter-spacing:.01em}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;background:rgba(255,255,255,.07);backdrop-filter:blur(12px)}
.voice-stage{position:relative;display:grid;place-items:center;padding:24px}
.orb-wrap{position:relative;width:min(58vw,360px);aspect-ratio:1;display:grid;place-items:center;filter:saturate(1.08)}
.orb-glow{position:absolute;inset:5%;border-radius:50%;background:conic-gradient(from 220deg,var(--pink),#a45fff,var(--blue),var(--cyan),#d3fff8,#6ea8ff,var(--pink));filter:blur(34px);opacity:.42;animation:floatGlow 5.8s ease-in-out infinite}
.orb{position:relative;width:78%;aspect-ratio:1;border-radius:50%;background:
  radial-gradient(circle at 38% 30%,rgba(255,255,255,.78),transparent 10%),
  radial-gradient(circle at 54% 58%,rgba(113,240,255,.96),transparent 22%),
  radial-gradient(circle at 70% 36%,rgba(107,112,255,.98),transparent 28%),
  radial-gradient(circle at 30% 70%,rgba(255,87,203,.86),transparent 29%),
  conic-gradient(from 210deg,#ff64d2,#865fff,#5e86ff,#73ecff,#f8ffff,#70d8ff,#8b68ff,#ff64d2);
  box-shadow:0 0 82px rgba(95,135,255,.24),inset 0 0 50px rgba(255,255,255,.20);
  animation:orbBreath 4.4s ease-in-out infinite;
  transform:translateZ(0)}
.orb:after{content:"";position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 50% 45%,transparent 20%,rgba(5,10,22,.10) 68%,rgba(0,0,0,.34) 100%);mix-blend-mode:multiply}
#voiceLive[data-state="listening"] .orb{animation-duration:1.8s}
#voiceLive[data-state="thinking"] .orb{animation-duration:1.1s;filter:hue-rotate(18deg)}
#voiceLive[data-state="speaking"] .orb{animation-duration:.86s;filter:saturate(1.18)}
.voice-copy{position:absolute;left:50%;transform:translateX(-50%);bottom:20%;width:min(86vw,520px);text-align:center;color:#aeb7c9;font-size:14px}
.voice-copy strong{display:block;color:#f5f7fb;font-size:17px;font-weight:600;margin-bottom:4px}
.voice-bottom{padding:12px 18px max(24px,env(safe-area-inset-bottom));display:flex;justify-content:center}
.voice-controls{display:flex;gap:12px;align-items:center;padding:9px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(15,21,34,.80);backdrop-filter:blur(20px);box-shadow:0 18px 70px rgba(0,0,0,.38)}
.voice-controls .icon-btn{width:52px;height:52px}
.voice-controls .main-mic{width:62px;height:62px;background:#eef2f8;color:#101827;border-color:transparent}
.voice-controls svg,.voice-top svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes orbBreath{0%,100%{transform:scale(.97) rotate(-2deg)}50%{transform:scale(1.035) rotate(2deg)}}
@keyframes floatGlow{0%,100%{transform:scale(.94);opacity:.34}50%{transform:scale(1.06);opacity:.53}}
@media(max-width:620px){
  .shell{padding:18px 12px 12px}
  .row{flex-wrap:wrap}
  .row input{flex-basis:100%}
  #log{min-height:54svh;border-radius:22px}
  .orb-wrap{width:min(78vw,340px)}
  .voice-copy{bottom:18%}
}
@media(prefers-reduced-motion:reduce){.orb,.orb-glow{animation:none}}
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand">0liviA</div>
    <span class="meta" id="status">sin sesión</span>
  </header>

  <div class="toolbar">
    <p class="hint">Chat persistente + Live Voice. Tu PC no es parte del runtime.</p>
    <button id="openVoice" class="voice-launch" type="button" aria-label="Abrir Live Voice">
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
      Live Voice
    </button>
  </div>

  <div id="log" aria-live="polite"></div>

  <div class="row">
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Token de acceso">
    <button id="new" type="button">Nueva sesión</button>
  </div>

  <form class="row">
    <input id="text" autocomplete="off" placeholder="Escribile a 0liviA…">
    <button id="send" class="primary">Enviar</button>
    <button id="cancel" class="secondary" type="button" disabled>Cancelar</button>
  </form>
</main>

<section id="voiceLive" data-state="idle" aria-hidden="true">
  <div class="voice-top">
    <div class="voice-name">0liviA · Live Voice</div>
    <button id="closeVoice" class="icon-btn" type="button" aria-label="Cerrar Live Voice">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div class="voice-stage">
    <div class="orb-wrap" aria-hidden="true">
      <div class="orb-glow"></div>
      <div class="orb"></div>
    </div>
    <div class="voice-copy">
      <strong id="voiceHeadline">Live Voice</strong>
      <span id="voiceStatus">Listo para hablar cuando la conexión de voz esté disponible.</span>
    </div>
  </div>

  <div class="voice-bottom">
    <div class="voice-controls">
      <button id="voiceMute" class="icon-btn" type="button" aria-label="Silenciar micrófono">
        <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v5M15 9V6a3 3 0 0 0-5.6-1.5M5 11a7 7 0 0 0 11.2 5.6M12 18v3M9 21h6M3 3l18 18"/></svg>
      </button>
      <button id="voiceMain" class="icon-btn main-mic" type="button" aria-label="Activar micrófono">
        <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
      </button>
      <button id="voiceEnd" class="icon-btn" type="button" aria-label="Finalizar Live Voice">
        <svg viewBox="0 0 24 24"><path d="M5 15c4-4 10-4 14 0"/><path d="M8 13l-2-3M16 13l2-3"/></svg>
      </button>
    </div>
  </div>
</section>

<script>
let sessionId=null, controller=null, turnId=null, token='', sseBuffer='';
let voiceStream=null, voiceMuted=false;
const log=document.querySelector('#log');
const status=document.querySelector('#status');
const text=document.querySelector('#text');
const voiceLive=document.querySelector('#voiceLive');
const voiceStatus=document.querySelector('#voiceStatus');
const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});

async function api(url,options={}){
  options.headers={...headers(),...(options.headers||{})};
  const r=await fetch(url,options);
  if(!r.ok)throw new Error(await r.text());
  return r;
}
function show(role,value){
  log.textContent+=`${role}: ${value}\n\n`;
  log.scrollTop=log.scrollHeight;
}
async function resume(){
  try{
    if(!sessionId){
      const list=await api('/api/sessions?limit=1');
      const data=await list.json();
      sessionId=data.sessions?.[0]?.id||null;
    }
    if(!sessionId){status.textContent='sin sesión';return;}
    const r=await api(`/api/sessions/${sessionId}/messages`);
    const d=await r.json();
    log.textContent='';
    d.messages.forEach(m=>show(m.role==='user'?'vos':'0liviA',m.content));
    status.textContent='sesión '+sessionId;
  }catch(e){status.textContent='token requerido';}
}
async function create(){
  const r=await api('/api/sessions',{method:'POST',body:JSON.stringify({title:'Chat es-AR'})});
  const d=await r.json();
  sessionId=d.id;
  log.textContent='';
  status.textContent='sesión '+sessionId;
}

document.querySelector('#token').addEventListener('input',e=>{
  token=e.target.value;
  sessionId=null;
  resume();
});
document.querySelector('#new').onclick=async()=>{
  try{await create()}catch(e){status.textContent='no autorizado'}
};
document.querySelector('#cancel').onclick=async()=>{
  const activeTurn=turnId;
  try{
    if(activeTurn)await api(`/api/chat/${sessionId}/cancel`,{
      method:'POST',
      body:JSON.stringify({turn_id:activeTurn})
    });
  }catch(e){}finally{controller?.abort();}
};

document.querySelector('form').onsubmit=async e=>{
  e.preventDefault();
  if(!sessionId)try{await create()}catch(e){status.textContent='creá una sesión con un token válido';return}
  const value=text.value.trim();
  if(!value)return;
  text.value='';
  show('vos',value);
  show('0liviA','');
  const current=log.textContent;
  controller=new AbortController();
  turnId=null;
  document.querySelector('#cancel').disabled=false;
  document.querySelector('#send').disabled=true;
  try{
    const r=await api(`/api/chat/${sessionId}`,{
      method:'POST',
      body:JSON.stringify({text:value}),
      signal:controller.signal
    });
    turnId=r.headers.get('X-Turn-ID');
    const reader=r.body.pipeThrough(new TextDecoderStream()).getReader();
    let answer='';
    sseBuffer='';
    while(true){
      const {value,done}=await reader.read();
      if(done)break;
      sseBuffer+=value;
      const lines=sseBuffer.split('\n');
      sseBuffer=lines.pop()||'';
      for(const line of lines)if(line.startsWith('data: ')){
        const event=JSON.parse(line.slice(6));
        if(event.type==='delta'){
          answer+=event.text;
          log.textContent=current+`0liviA: ${answer}`;
          log.scrollTop=log.scrollHeight;
        }
        if(event.type==='error')throw new Error(event.code||event.error);
      }
    }
    if(sseBuffer.startsWith('data: ')){
      const event=JSON.parse(sseBuffer.slice(6));
      if(event.type==='delta'){
        answer+=event.text;
        log.textContent=current+`0liviA: ${answer}`;
      }
    }
    log.textContent+='\n\n';
  }catch(e){
    if(e.name==='AbortError')log.textContent+='[turno cancelado]\n\n';
    else log.textContent+=`[error: ${e.message}]\n\n`;
  }finally{
    controller=null;turnId=null;
    document.querySelector('#cancel').disabled=true;
    document.querySelector('#send').disabled=false;
  }
};

function setVoiceState(state,headline,copy){
  voiceLive.dataset.state=state;
  document.querySelector('#voiceHeadline').textContent=headline;
  voiceStatus.textContent=copy;
}
function stopLocalMic(){
  if(voiceStream){
    voiceStream.getTracks().forEach(t=>t.stop());
    voiceStream=null;
  }
  voiceMuted=false;
}
function closeVoice(){
  stopLocalMic();
  voiceLive.classList.remove('active');
  voiceLive.setAttribute('aria-hidden','true');
  setVoiceState('idle','Live Voice','Listo para hablar cuando la conexión de voz esté disponible.');
}
document.querySelector('#openVoice').onclick=()=>{
  voiceLive.classList.add('active');
  voiceLive.setAttribute('aria-hidden','false');
  setVoiceState('idle','Live Voice','Pantalla completa · es-AR');
};
document.querySelector('#closeVoice').onclick=closeVoice;
document.querySelector('#voiceEnd').onclick=closeVoice;

document.querySelector('#voiceMain').onclick=async()=>{
  if(voiceStream){
    setVoiceState('listening','Te escucho','Micrófono activo · es-AR');
    return;
  }
  try{
    voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
    setVoiceState('listening','Te escucho','Micrófono activo · es-AR');
  }catch(e){
    setVoiceState('idle','Micrófono bloqueado','Dale permiso al navegador para usar Live Voice.');
  }
};
document.querySelector('#voiceMute').onclick=()=>{
  if(!voiceStream)return;
  voiceMuted=!voiceMuted;
  voiceStream.getAudioTracks().forEach(t=>t.enabled=!voiceMuted);
  setVoiceState(
    voiceMuted?'idle':'listening',
    voiceMuted?'Micrófono silenciado':'Te escucho',
    voiceMuted?'Tocá el micrófono para volver':'Micrófono activo · es-AR'
  );
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&voiceLive.classList.contains('active'))closeVoice();
});
</script>
</body>
</html>
