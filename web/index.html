<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>0liviA</title>
<style>body{font:16px system-ui,sans-serif;max-width:760px;margin:0 auto;padding:1rem;background:#101827;color:#eef2f7}header{display:flex;justify-content:space-between;align-items:center}#log{min-height:60vh;padding:1rem;border:1px solid #334155;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:.5rem;margin-top:.75rem}input,button{font:inherit;padding:.7rem;border-radius:7px;border:1px solid #64748b}input{flex:1;background:#172235;color:inherit}button{background:#2563eb;color:white;cursor:pointer}button.secondary{background:#475569}.meta{color:#94a3b8;font-size:.85rem}</style>
</head><body><header><h1>0liviA</h1><span class="meta" id="status">sin sesión</span></header>
<p class="meta">Conversación persistente, respuesta en streaming y cancelación. El navegador solo guarda el identificador de sesión.</p>
<div id="log" aria-live="polite"></div>
<div class="row"><input id="token" type="password" placeholder="Token de acceso"><button id="new">Nueva sesión</button></div>
<form class="row"><input id="text" autocomplete="off" placeholder="Escribile a 0liviA…"><button id="send">Enviar</button><button id="cancel" class="secondary" type="button" disabled>Cancelar</button></form>
<script>
const key='olivia_session_id'; let sessionId=sessionStorage.getItem(key), controller=null, turnId=null, token='', sseBuffer='';
const log=document.querySelector('#log'), status=document.querySelector('#status'), text=document.querySelector('#text');
const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});
async function api(url,options={}){options.headers={...headers(),...(options.headers||{})};const r=await fetch(url,options);if(!r.ok)throw new Error(await r.text());return r;}
function show(role,value){log.textContent+=`${role}: ${value}\n\n`;log.scrollTop=log.scrollHeight;}
async function resume(){if(!sessionId)return;try{const r=await api(`/api/sessions/${sessionId}/messages`);const d=await r.json();log.textContent='';d.messages.forEach(m=>show(m.role==='user'?'vos':'0liviA',m.content));status.textContent='sesión '+sessionId;}catch(e){status.textContent='token requerido';}}
async function create(){const r=await api('/api/sessions',{method:'POST',body:JSON.stringify({title:'Chat es-AR'})});const d=await r.json();sessionId=d.id;sessionStorage.setItem(key,sessionId);log.textContent='';status.textContent='sesión '+sessionId;}
document.querySelector('#token').addEventListener('input',e=>{token=e.target.value;resume();});
document.querySelector('#new').onclick=async()=>{try{await create()}catch(e){status.textContent='no autorizado'}};
document.querySelector('#cancel').onclick=async()=>{const activeTurn=turnId;try{if(activeTurn)await api(`/api/chat/${sessionId}/cancel`,{method:'POST',body:JSON.stringify({turn_id:activeTurn})});}catch(e){}finally{controller?.abort();}};
document.querySelector('form').onsubmit=async e=>{e.preventDefault();if(!sessionId)try{await create()}catch(e){status.textContent='creá una sesión con un token válido';return}const value=text.value.trim();if(!value)return;text.value='';show('vos',value);show('0liviA','');const current=log.textContent;controller=new AbortController();turnId=null;document.querySelector('#cancel').disabled=false;document.querySelector('#send').disabled=true;try{const r=await api(`/api/chat/${sessionId}`,{method:'POST',body:JSON.stringify({text:value}),signal:controller.signal});turnId=r.headers.get('X-Turn-ID');const reader=r.body.pipeThrough(new TextDecoderStream()).getReader();let answer='';sseBuffer='';while(true){const {value,done}=await reader.read();if(done)break;sseBuffer+=value;const lines=sseBuffer.split('\n');sseBuffer=lines.pop()||'';for(const line of lines)if(line.startsWith('data: ')){const event=JSON.parse(line.slice(6));if(event.type==='delta'){answer+=event.text;log.textContent=current+`0liviA: ${answer}`;log.scrollTop=log.scrollHeight;}if(event.type==='error')throw new Error(event.code||event.error);}}if(sseBuffer.startsWith('data: ')){const event=JSON.parse(sseBuffer.slice(6));if(event.type==='delta'){answer+=event.text;log.textContent=current+`0liviA: ${answer}`;}}log.textContent+='\n\n';}catch(e){if(e.name==='AbortError')log.textContent+='[turno cancelado]\n\n';else log.textContent+=`[error: ${e.message}]\n\n`;}finally{controller=null;turnId=null;document.querySelector('#cancel').disabled=true;document.querySelector('#send').disabled=false;}};
resume();
</script></body></html>
