<!doctype html><meta charset="utf-8"><title>0liviA proof</title>
<style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#10131a;color:#e8edf5}#log{min-height:22rem;border:1px solid #384252;padding:1rem;border-radius:8px;white-space:pre-wrap}form{display:flex;gap:.5rem;margin-top:1rem}input{flex:1;padding:.8rem;background:#1b2230;color:inherit;border:1px solid #4a566a;border-radius:6px}button{padding:.8rem 1rem}</style>
<h1>0liviA — vertical proof</h1><p>Sesión durable + router reemplazable + herramienta repo + respuesta SSE.</p><div id="log"></div><form><input id="msg" autocomplete="off" placeholder="Escribe un mensaje…"><button>Enviar</button></form>
<script>const sid=localStorage.olivia_sid||(localStorage.olivia_sid=crypto.randomUUID()),log=document.querySelector('#log'); async function load(){const r=await fetch('/api/session?session_id='+sid);const d=await r.json();log.textContent=d.messages.map(x=>x.role+': '+x.content).join('\n\n')} load(); document.querySelector('form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#msg'),message=input.value.trim();if(!message)return; input.value='';log.textContent+='\n\nuser: '+message+'\nassistant: ';const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message})});if(!r.ok){log.textContent+='\n[error] '+await r.text();return}const reader=r.body.pipeThrough(new TextDecoderStream()).getReader();while(true){const {value,done}=await reader.read();if(done)break;for(const line of value.split('\n'))if(line.startsWith('data: ')){const d=JSON.parse(line.slice(6));if(d.token)log.textContent+=d.token;}}};</script>
