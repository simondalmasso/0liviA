[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "0livia-core"
version = "0.1.0"
description = "Self-hosted agentic AI workspace for chat, coding, research, memory, projects and voice."
requires-python = ">=3.11"
keywords = [
  "agentic-ai",
  "self-hosted-ai",
  "ai-assistant",
  "coding-agent",
  "web-research",
  "long-term-memory",
  "voice-assistant",
  "llm-router",
]
dependencies = [
  "aiohttp>=3.10,<4",
]

[project.scripts]
olivia = "olivia.server:main"

[project.optional-dependencies]
chatgpt = [
  "PyJWT[crypto]>=2.10,<3",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-aiohttp>=1.0,<2",
  "PyJWT[crypto]>=2.10,<3",
]

[tool.setuptools.packages.find]
include = ["olivia*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
