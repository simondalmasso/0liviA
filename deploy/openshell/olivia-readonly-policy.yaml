# Optional OpenShell policy template — NOT a deployed service.
# Derived independently from NVIDIA/OpenShell's Apache-2.0 policy examples.
# Validate against a *pinned OpenShell release* and its policy prover before use.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /app
    - /etc
  read_write:
    - /sandbox
    - /tmp

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  github_readonly:
    name: github-readonly
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/git
# No general outbound access, credentials, git push, localhost or model endpoint.
# Do not rely on best_effort isolation until host enforcement is proved.
