#cloud-config
package_update: false

# Thin launcher only. The canonical deployment logic lives in deploy/bootstrap-a1.sh.
# Production boot is intentionally fail-closed: REF must be an exact 40-char commit SHA.
write_files:
  - path: /root/run-0livia-bootstrap.sh
    permissions: '0700'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      REF="${REF:-}"
      if [[ ! "${REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
        echo "REF must be an exact 40-character commit SHA" >&2
        exit 2
      fi
      BASE="https://raw.githubusercontent.com/simondalmasso/0liviA"
      curl -fsSL --retry 3 --retry-delay 2 \
        "${BASE}/${REF}/deploy/bootstrap-a1.sh" \
        -o /root/0livia-bootstrap.sh
      chmod 0700 /root/0livia-bootstrap.sh
      REF="${REF}" /root/0livia-bootstrap.sh

runcmd:
  - [ bash, /root/run-0livia-bootstrap.sh ]

final_message: "0liviA bootstrap finished after $UPTIME seconds"
