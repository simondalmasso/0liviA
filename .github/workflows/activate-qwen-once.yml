name: Qwen3.8 One-Time Free Activation

# Runs once when this workflow is first merged to canonical main.
# Subsequent unrelated pushes cannot re-trigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/activate-qwen-once.yml

permissions:
  contents: read

concurrency:
  group: olivia-public-shell-deploy
  cancel-in-progress: false

jobs:
  activate-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OLIVIA_DEMO_ZERO_COST_CONFIRMED: ${{ vars.OLIVIA_DEMO_ZERO_COST_CONFIRMED }}
      RELEASE_SHA: ${{ github.sha }}
      PUBLIC_SHELL_URL: https://0livia.simondalmasso44.workers.dev
    steps:
      - name: Require exact owner-authorized one-time activation event
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/main"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          message = (event.get("head_commit") or {}).get("message", "")
          if not message.startswith("feat(qwen): activate on Workers Free (#"):
              raise SystemExit("BLOCKED: this is not the approved one-shot release")
          PY
          test "${OLIVIA_DEMO_ZERO_COST_CONFIRMED:-}" = "1"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Checkout exact main commit, no saved GitHub token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify actual account has Workers Free billing hard-stop
        run: python3 scripts/verify_cloudflare_free.py

      - name: Regress Qwen route and lightweight public shell before external write
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/worker.mjs
          node --test tests/node/test_cloudflare_worker.mjs
          python3 - <<'PY'
          from pathlib import Path
          web = Path("web/index.html").read_bytes()
          assert len(web) < 96000
          assert b'id="demoModelSelect"' in web
          worker = Path("cloudflare/worker.mjs").read_text()
          assert 'const DEMO_QWEN_MODEL = "@cf/qwen/qwen3.8-27b"' in worker
          assert 'DEMO_DAILY_REQUEST_LIMIT = 25' in worker
          assert 'qwenEnabled(env)' in worker
          PY

      - name: Generate exact Qwen-enabled Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          release = os.environ["RELEASE_SHA"]
          assert len(release) == 40 and all(c in "0123456789abcdef" for c in release)
          config = {
              "name": "0livia",
              "main": "./cloudflare/worker.mjs",
              "compatibility_date": "2026-10-04",
              "compatibility_flags": ["global_fetch_strictly_public"],
              "workers_dev": True,
              "preview_urls": False,
              "assets": {"directory": "./web", "binding": "ASSETS"},
              "ai": {"binding": "AI"},
              "durable_objects": {"bindings": [{"name": "COST_GUARD", "class_name": "CostGuard"}]},
              "exports": {"CostGuard": {"type": "durable-object", "storage": "sqlite"}},
              "vars": {
                  "OLIVIA_DEMO_ZERO_COST_CONFIRMED": "1",
                  "OLIVIA_DEMO_QWEN_ZERO_COST_CONFIRMED": "1",
                  "OLIVIA_DEMO_GEMMA_ZERO_COST_CONFIRMED": "0",
                  "OLIVIA_DEMO_GEMMA_LIVE_VERIFIED": "0",
                  "OLIVIA_RELEASE_SHA": release,
              },
          }
          Path("wrangler.qwen.once.jsonc").write_text(json.dumps(config, indent=2) + "\n")
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.14.0"

      - name: Publish Qwen-enabled public Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes wrangler@4.127.1 -- deploy --config wrangler.qwen.once.jsonc --keep-vars --message "Qwen Free activation @${RELEASE_SHA}"

      - name: Live exact-SHA and Qwen model canary
        shell: bash
        run: |
          set -euo pipefail
          cb="${RELEASE_SHA}"
          health="$(curl -fsS --max-time 25 "${PUBLIC_SHELL_URL}/healthz?cb=${cb}")"
          HEALTH_JSON="${health}" python3 - <<'PY'
          import json, os
          h = json.loads(os.environ["HEALTH_JSON"])
          assert h.get("release_sha") == os.environ["RELEASE_SHA"]
          assert h.get("api_mode") == "public_shell"
          assert h.get("demo_qwen_ready") is True
          assert h.get("demo_gemma_ready") is False
          assert h.get("demo_daily_request_limit") == 25
          assert any(m.get("id") == "qwen" and m.get("available") is True and
                     m.get("model") == "@cf/qwen/qwen3.8-27b"
                     for m in h.get("demo_models", []))
          PY
          status="$(curl -sS --max-time 60 -o /tmp/qwen-canary.json -w '%{http_code}' -X POST "${PUBLIC_SHELL_URL}/api/demo-chat?cb=${cb}"             -H "Origin: ${PUBLIC_SHELL_URL}" -H "Content-Type: application/json"             --data '{"model":"qwen","messages":[{"role":"user","content":"Respondé brevemente: OK."}]}')"
          test "${status}" = "200"
          DEMO_JSON="$(cat /tmp/qwen-canary.json)" python3 - <<'PY'
          import json, os
          j = json.loads(os.environ["DEMO_JSON"])
          assert j.get("provider") == "workers-ai-demo"
          assert j.get("model") == "@cf/qwen/qwen3.8-27b"
          assert str(j.get("answer") or "").strip()
          assert j.get("canonical") is False
          print("LIVE_QWEN_CANARY=PASS; actual provider/model response, not fake readiness")
          PY

      - name: Disable Qwen automatically if live release cannot pass
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("wrangler.qwen.once.jsonc")
          obj = json.loads(p.read_text())
          obj["vars"]["OLIVIA_DEMO_QWEN_ZERO_COST_CONFIRMED"] = "0"
          p.write_text(json.dumps(obj) + "\n")
          PY
          npm exec --yes wrangler@4.127.1 -- deploy --config wrangler.qwen.once.jsonc --keep-vars --message "Qwen canary failed: disabled safe rollback"
          echo "QWEN_ROLLED_BACK=YES"

      - name: Clean ephemeral config and canary output
        if: always()
        run: rm -f wrangler.qwen.once.jsonc /tmp/qwen-canary.json

      - name: Report activation
        if: success()
        run: |
          echo "QWEN_3_8_LIVE=TRUE; RELEASE_SHA=${RELEASE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "URL=${PUBLIC_SHELL_URL}" >> "${GITHUB_STEP_SUMMARY}"
