name: Qwen Activation (FROZEN pending P0 owner auth and cost certification)

# No push trigger, no inference, no deploy. The previous one-shot
# implementation remains recoverable through Git history.
# Frozen per owner P0 directive: do not expand providers before the first
# authenticated GLM turn and verified Cloudflare no-overage entitlement.
on:
  workflow_dispatch:
    inputs:
      acknowledge_frozen:
        description: "Read-only diagnostic; does not activate or deploy Qwen"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frozen:
    if: ${{ inputs.acknowledge_frozen == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Qwen remains disabled
        run: |
          echo "BLOCKED: Qwen activation is frozen until owner Auth0, Free/no-overage, and GLM acceptance gates are verified." >> "$GITHUB_STEP_SUMMARY"
          echo "No Cloudflare API, no Wrangler deployment, no Workers AI, no canary."
