name: 0liviA Mobile UI Smoke Once

on:
  workflow_dispatch:
  push:
    branches:
      - arch/gpt-synthesis-v1
    paths:
      - .github/ui-smoke-trigger

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned browser harness
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: Serve UI locally
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8766 --bind 127.0.0.1 --directory web >/tmp/olivia-ui-http.log 2>&1 &
          echo $! >/tmp/olivia-ui-http.pid
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8766/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/olivia-ui-http.log >&2
          exit 1

      - name: Smoke 360x800 and 430x900
        run: |
          python scripts/ui_mobile_smoke.py             http://127.0.0.1:8766/             /tmp/olivia-mobile-smoke

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olivia-mobile-ui-smoke
          path: /tmp/olivia-mobile-smoke
          if-no-files-found: error
          retention-days: 7
