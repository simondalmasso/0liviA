name: 0liviA Coding Worker
run-name: "0liviA code ${{ inputs.olivia_job_id }}"

on:
  workflow_dispatch:
    inputs:
      olivia_job_id:
        description: "0liviA durable job identifier"
        required: true
        type: string
      task:
        description: "Engineering task for the coding agent"
        required: true
        type: string
      base_ref:
        description: "Exact branch/SHA to start from"
        required: true
        default: "arch/gpt-synthesis-v1"
        type: string
      mode:
        description: "Engineering mode"
        required: true
        default: "implement"
        type: choice
        options:
          - implement
          - repair
      publish_branch:
        description: "Push the isolated agent branch after final tests pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: olivia-coding-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AIDER_OPENAI_API_BASE: "https://integrate.api.nvidia.com/v1"
      AIDER_OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AIDER_MODEL: "openai/deepseek-ai/deepseek-v4.1-flash"
      AIDER_ANALYTICS_DISABLE: "true"
      PYTHONUNBUFFERED: "1"
      BASE_REF: ${{ inputs.base_ref }}
      MODE: ${{ inputs.mode }}
      MAX_AGENT_PASSES: "2"

    steps:
      - name: Fail closed without the development-only NIM key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AIDER_OPENAI_API_KEY"

      - name: Checkout exact base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch ref
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --allow-onelevel "$BASE_REF"
          test -n "$(git rev-parse --verify HEAD^{commit})"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare isolated branch and dependencies
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/coding-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "AGENT_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' 'aider-chat==0.86.2'

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q olivia tests
          pytest -q

      - name: Build senior engineering brief
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          mode = os.environ["MODE"]
          task = os.environ["TASK"].strip()
          mode_rule = (
              "Reproduce the failure first when feasible, identify root cause, then make the smallest repair."
              if mode == "repair"
              else "Implement the requested behavior with the smallest coherent production-quality diff."
          )
          brief = f"""You are the bounded 0liviA senior coding worker.

MODE: {mode}
TASK:
{task}

MANDATORY ENGINEERING CONTRACT:
- Read and obey AGENTS.md, README.md, docs/ARCHITECTURE.md, docs/DECISIONS.md and docs/SECURITY_AUDIT.md.
- {mode_rule}
- Inspect existing code/tests before editing. Preserve unrelated user work.
- Do not deploy, rotate credentials, alter provider billing, or weaken security/cost guards.
- Never put secrets in code, logs, tests or prompts.
- Prefer root-cause fixes over symptom patches.
- Add or update regression tests for changed behavior.
- Do not skip, delete or weaken failing tests merely to obtain green CI.
- Keep public APIs/backward compatibility unless the task explicitly requires a migration.
- Keep the diff focused; remove dead code introduced or made obsolete by your change.
- Finish only after the repository's deterministic verification passes.
"""
          Path("/tmp/agent-brief.txt").write_text(brief, encoding="utf-8")
          PY

      - name: Execute senior coding pass
        shell: bash
        run: |
          set -euo pipefail
          aider             --model "$AIDER_MODEL"             --openai-api-base "$AIDER_OPENAI_API_BASE"             --openai-api-key "$AIDER_OPENAI_API_KEY"             --yes-always             --no-stream             --no-analytics             --no-check-update             --no-show-release-notes             --no-show-model-warnings             --read AGENTS.md             --read README.md             --read docs/ARCHITECTURE.md             --read docs/DECISIONS.md             --read docs/SECURITY_AUDIT.md             --test-cmd "pytest -q"             --auto-test             --message "$(cat /tmp/agent-brief.txt)"

      - name: Verify pass and collect repair evidence
        shell: bash
        run: |
          set +e
          {
            python -m compileall -q olivia tests
            python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit(f"expected exactly one inline script, got {len(scripts)}")
          Path("/tmp/olivia-ui.js").write_text(scripts[0], encoding="utf-8")
          PY
            node --check /tmp/olivia-ui.js
            node --check cloudflare/worker.mjs
            pytest -q
          } > /tmp/verify-pass-1.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "REPAIR_PASS=false" >> "$GITHUB_ENV"
          else
            echo "REPAIR_PASS=true" >> "$GITHUB_ENV"
            echo "repair_pass required after deterministic verification failure"
            tail -n 220 /tmp/verify-pass-1.log
          fi

      - name: Build bounded repair brief
        if: env.REPAIR_PASS == 'true'
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          failure = Path("/tmp/verify-pass-1.log").read_text(encoding="utf-8", errors="replace")[-12000:]
          brief = f"""This is repair_pass 2 of {os.environ['MAX_AGENT_PASSES']}. No further model pass exists.

Original task:
{os.environ['TASK']}

The deterministic verification failed after the first pass. Diagnose the actual failure below, make the minimum root-cause correction, preserve unrelated work, and do not weaken tests/security/cost guards.

VERIFICATION FAILURE:
{failure}
"""
          Path("/tmp/agent-repair.txt").write_text(brief, encoding="utf-8")
          PY

      - name: Execute bounded repair pass
        if: env.REPAIR_PASS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aider             --model "$AIDER_MODEL"             --openai-api-base "$AIDER_OPENAI_API_BASE"             --openai-api-key "$AIDER_OPENAI_API_KEY"             --yes-always             --no-stream             --no-analytics             --no-check-update             --no-show-release-notes             --no-show-model-warnings             --read AGENTS.md             --read docs/SECURITY_AUDIT.md             --test-cmd "pytest -q"             --auto-test             --message "$(cat /tmp/agent-repair.txt)"

      - name: Final deterministic verification
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q olivia tests
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit(f"expected exactly one inline script, got {len(scripts)}")
          Path("/tmp/olivia-ui.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/olivia-ui.js
          node --check cloudflare/worker.mjs
          pytest -q

      - name: Persist verified residual changes
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "0liviA coding worker"
            git config user.email "0livia-agent@users.noreply.github.com"
            git add -A
            git commit -m "agent: persist verified coding result"
          fi

      - name: Summarize changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git log --oneline --decorate -8
          git diff --stat "$BASE_REF...HEAD" || true

      - name: Push isolated result
        if: ${{ inputs.publish_branch }}
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_REF...HEAD"; then
            echo "No agent changes to publish."
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git config --local core.hooksPath /dev/null
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth"             push origin "HEAD:refs/heads/$AGENT_BRANCH"
          unset auth GH_PUSH_TOKEN
          echo "PUBLISHED_BRANCH=$AGENT_BRANCH"
