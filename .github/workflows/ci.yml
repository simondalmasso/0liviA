name: core-ci

on:
  push:
    branches:
      - main
      - arch/**
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q olivia tests scripts
      - name: Scan tracked runtime tree for high-confidence secrets
        run: python scripts/scan_secret_tree.py
      - name: Scan Git history for high-confidence secrets
        run: python scripts/scan_secret_history.py
      - name: Check deployment and setup scripts
        run: bash -n deploy/*.sh scripts/*.sh
      - name: Check browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit(f"expected exactly one inline script, got {len(scripts)}")
          Path("/tmp/olivia-ui.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/olivia-ui.js
      - name: Check Cloudflare Worker syntax
        run: node --check cloudflare/worker.mjs
      - name: Test Cloudflare Worker behavior without external inference
        run: node --test tests/node/test_cloudflare_worker.mjs
      - name: Test
        run: pytest -q
