name: 0liviA E2E

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Test the permanent production URL and send one real demo prompt"
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "cloudflare/**"
      - "e2e.config.ts"
      - "tests-e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "cloudflare/**"
      - "e2e.config.ts"
      - "tests-e2e/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: olivia-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.14.0"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned e2e runner
        run: |
          npm install --no-save --package-lock=false \
            e2e@0.18.0 \
            @e2e-dev/web@0.13.0 \
            playwright-core@1.63.0
          npx e2e-web install chromium --with-deps

      - name: Serve public shell assets
        if: inputs.live != true
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8767 --bind 127.0.0.1 --directory web >/tmp/olivia-e2e-http.log 2>&1 &
          echo $! >/tmp/olivia-e2e-http.pid
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8767/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/olivia-e2e-http.log >&2
          exit 1

      - name: Test home to demo chat flow
        if: inputs.live != true
        env:
          E2E_TELEMETRY_DISABLED: "1"
          OLIVIA_E2E_URL: "http://127.0.0.1:8767"
          OLIVIA_E2E_MOCK_DEMO: "1"
        run: npx e2e run tests-e2e/public-demo.e2e.ts --reporter list

      - name: Live E2E against permanent 0liviA
        if: inputs.live == true
        env:
          E2E_TELEMETRY_DISABLED: "1"
          OLIVIA_E2E_URL: "https://0livia.simondalmasso44.workers.dev"
          OLIVIA_E2E_LIVE: "1"
        run: npx e2e run tests-e2e/public-demo.e2e.ts --reporter list

      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: olivia-e2e
          path: |
            .e2e/report.json
            .e2e/artifacts
          if-no-files-found: warn
          retention-days: 7
