name: 0liviA NVIDIA NIM Trial Evaluation

on:
  workflow_dispatch:
    inputs:
      acknowledge_trial_only:
        description: "I understand this is internal evaluation, NOT production access"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trial-eval:
    if: ${{ inputs.acknowledge_trial_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_NIM_TRIAL_NONBILLABLE_CONFIRMED: ${{ vars.NVIDIA_NIM_TRIAL_NONBILLABLE_CONFIRMED }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fail closed if trial credit/no-billing gate unverified
        shell: bash
        run: |
          set -euo pipefail
          test "${NVIDIA_NIM_TRIAL_NONBILLABLE_CONFIRMED:-}" = "1"
          test -n "${NVIDIA_API_KEY:-}"
          echo "Manual trial evaluation authorized; no production routing."
      - name: One bounded official NVIDIA DeepSeek V4.1 Flash probe
        run: python3 scripts/eval_nvidia_nim.py
      - name: Confirm evaluation is not a production deployment
        run: echo "EVAL_ONLY=YES; NO_SECRET_EXPOSURE=YES; NO_PUBLIC_MODEL_ROUTE=YES"
