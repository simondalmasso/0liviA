name: 0liviA Public Shell Deploy

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - cloudflare/**
      - e2e.config.ts
      - tests-e2e/**
      - .github/workflows/deploy-public-shell.yml
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-hex canonical main SHA; defaults to the selected branch HEAD when omitted"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: olivia-public-shell-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OLIVIA_DEMO_ZERO_COST_CONFIRMED: ${{ vars.OLIVIA_DEMO_ZERO_COST_CONFIRMED }}
      OLIVIA_DEMO_QWEN_ZERO_COST_CONFIRMED: ${{ vars.OLIVIA_DEMO_QWEN_ZERO_COST_CONFIRMED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable canonical release
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${REQUESTED_SHA:-}" ]]; then
            release_sha="${REQUESTED_SHA}"
          else
            release_sha="${GITHUB_SHA}"
          fi
          [[ "${release_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "${release_sha}^{commit}"
          git merge-base --is-ancestor "${release_sha}" origin/main
          git checkout --detach "${release_sha}"
          test "$(git rev-parse HEAD)" = "${release_sha}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_SHA=${release_sha}" >> "${GITHUB_ENV}"

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "${OLIVIA_DEMO_ZERO_COST_CONFIRMED:-}" = "1"

      - name: Verify public-shell source boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'api_mode: "public_shell"' cloudflare/worker.mjs
          grep -Fq 'provider_ready: false' cloudflare/worker.mjs
          grep -Fq 'inference_enabled: false' cloudflare/worker.mjs
          grep -Fq 'web_read: false' cloudflare/worker.mjs
          grep -Fq 'hard_zero_cost: true' cloudflare/worker.mjs
          grep -Fq 'url.pathname === "/api/demo-chat"' cloudflare/worker.mjs
          grep -Fq 'OLIVIA_DEMO_ZERO_COST_CONFIRMED' cloudflare/worker.mjs
          grep -Fq '@cf/zai-org/glm-4.7-flash' cloudflare/worker.mjs
          grep -Fq '@cf/qwen/qwen3-30b-a3b-fp8' cloudflare/worker.mjs
          grep -Fq '0liviA — Tu IA personal' web/index.html
          ! grep -Fq 'id="modeChat"' web/index.html
          ! grep -Fq 'id="modeWork"' web/index.html

      - name: Build exact Wrangler deployment config
        shell: bash
        run: |
          cat > wrangler.deploy.runtime.jsonc <<'JSON'
          {
            "name": "0livia",
            "main": "./cloudflare/worker.mjs",
            "compatibility_date": "2026-10-04",
            "compatibility_flags": ["global_fetch_strictly_public"],
            "workers_dev": true,
            "preview_urls": false,
            "assets": {
              "directory": "./web",
              "binding": "ASSETS"
            },
            "vars": {
              "OLIVIA_DEMO_ZERO_COST_CONFIRMED": "1"
            },
            "ai": {
              "binding": "AI"
            },
            "durable_objects": {
              "bindings": [
                {
                  "name": "COST_GUARD",
                  "class_name": "CostGuard"
                }
              ]
            },
            "exports": {
              "CostGuard": {
                "type": "durable-object",
                "storage": "sqlite"
              }
            }
          }
          JSON
          # Missing account-level Qwen proof always produces a disabled route,
          # even when Wrangler uses --keep-vars on an existing Worker.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("wrangler.deploy.runtime.jsonc")
          config = json.loads(path.read_text())
          config["vars"]["OLIVIA_DEMO_QWEN_ZERO_COST_CONFIRMED"] = (
              "1" if os.getenv("OLIVIA_DEMO_QWEN_ZERO_COST_CONFIRMED") == "1" else "0"
          )
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Deploy exact public shell
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes wrangler@4.127.1 -- deploy --config wrangler.deploy.runtime.jsonc --keep-vars --message "public shell main@${RELEASE_SHA}" 2>&1 | tee /tmp/wrangler-deploy.log
          public_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n1 || true)"
          test -n "${public_url}"
          echo "public_url=${public_url}" >> "${GITHUB_OUTPUT}"
          echo "PUBLIC_SHELL_URL=${public_url}" >> "${GITHUB_ENV}"

      - name: Cache-busted production smoke
        shell: bash
        env:
          PUBLIC_SHELL_URL: ${{ steps.deploy.outputs.public_url }}
        run: |
          set -euo pipefail
          base="${PUBLIC_SHELL_URL}"
          [[ "${base}" == https://*.workers.dev ]]
          cb="$(date +%s)"
          root="$(curl -fsS --max-time 20 "${base}/?cb=${cb}")"
          grep -Fq '0liviA — Tu IA personal' <<<"${root}"
          grep -Fq 'Probar 0liviA ahora' <<<"${root}"
          ! grep -Fq 'id="modeChat"' <<<"${root}"
          ! grep -Fq 'id="modeWork"' <<<"${root}"

          health="$(curl -fsS --max-time 20 "${base}/healthz?cb=${cb}")"
          HEALTH_JSON="${health}" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ["HEALTH_JSON"])
          checks = {
              "process_alive": body.get("process_alive") is True,
              "api_mode": body.get("api_mode") == "public_shell",
              "public_shell": body.get("public_shell") is True,
              "bridge_enabled": body.get("bridge_enabled") is False,
              "provider_ready": body.get("provider_ready") is False,
              "inference_enabled": body.get("inference_enabled") is False,
              "demo_provider_ready": body.get("demo_provider_ready") is True,
              "demo_provider": body.get("demo_provider") == "workers-ai-demo",
              "demo_model": body.get("demo_model") == "@cf/zai-org/glm-4.7-flash",
              "demo_qwen_ready": body.get("demo_qwen_ready") is (os.getenv("OLIVIA_DEMO_QWEN_ZERO_COST_CONFIRMED") == "1"),
              "web_read": body.get("web_read") is False,
              "hard_zero_cost": body.get("hard_zero_cost") is True,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("public-shell smoke failed: " + ", ".join(failed))
          PY

          chat_status="$(curl -sS --max-time 20 -o /tmp/olivia-chat-response -w '%{http_code}' -X POST "${base}/api/chat?cb=${cb}")"
          test "${chat_status}" = "503"

          demo_status="$(curl -sS --max-time 45 -o /tmp/olivia-demo-response -w '%{http_code}' \
            -X POST "${base}/api/demo-chat?cb=${cb}" \
            -H 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"Respondé con una frase breve."}]}')"
          test "${demo_status}" = "200"
          DEMO_JSON="$(cat /tmp/olivia-demo-response)" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ["DEMO_JSON"])
          if not str(body.get("answer", "")).strip():
              raise SystemExit("demo answer empty")
          if body.get("provider") != "workers-ai-demo":
              raise SystemExit("unexpected demo provider")
          if body.get("model") != "@cf/zai-org/glm-4.7-flash":
              raise SystemExit("unexpected demo model")
          if body.get("canonical") is not False:
              raise SystemExit("demo incorrectly marked canonical")
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.14.0"

      - name: Install pinned e2e browser gate
        run: |
          npm install --no-save --package-lock=false \
            e2e@0.18.0 \
            @e2e-dev/web@0.13.0 \
            playwright-core@1.63.0
          npx e2e-web install chromium --with-deps

      - name: Live production e2e
        env:
          E2E_TELEMETRY_DISABLED: "1"
          OLIVIA_E2E_URL: ${{ steps.deploy.outputs.public_url }}
          OLIVIA_E2E_LIVE: "1"
        run: npx e2e run tests-e2e/public-demo.e2e.ts --reporter list

      - name: Upload production e2e evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: olivia-production-e2e
          path: |
            .e2e/report.json
            .e2e/artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Public-shell summary
        if: success()
        shell: bash
        run: |
          {
            echo "### 0liviA public shell"
            echo "- source: \`main@${RELEASE_SHA}\`"
            echo "- root: HTTP 200, Spanish single-surface UI"
            echo "- canonical /api/chat: HTTP 503"
            echo "- demo: Workers AI GLM 4.7 Flash, server-side guard, live E2E PASS"
            echo "- URL: ${PUBLIC_SHELL_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove ephemeral deploy config
        if: always()
        shell: bash
        run: rm -f wrangler.deploy.runtime.jsonc
