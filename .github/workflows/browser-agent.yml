name: 0liviA Browser Worker
run-name: "0liviA browse ${{ inputs.olivia_job_id }}"

on:
  workflow_dispatch:
    inputs:
      olivia_job_id:
        description: "0liviA durable job identifier"
        required: true
        type: string
      url:
        description: "Public HTTP/HTTPS URL to render"
        required: true
        type: string
      base_ref:
        description: "Exact trusted branch/SHA containing the runner"
        required: true
        default: "arch/gpt-synthesis-v1"
        type: string

permissions:
  contents: read

concurrency:
  group: olivia-browser-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_REF: ${{ inputs.base_ref }}
      TARGET_URL: ${{ inputs.url }}
      REPO_PRIVATE: ${{ github.event.repository.private }}

    steps:
      - name: Fail closed unless browser artifacts stay inside a private repository
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO_PRIVATE" = "true"

      - name: Checkout trusted base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch ref
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --allow-onelevel "$BASE_REF"
          git fetch --no-tags origin refs/heads/arch/gpt-synthesis-v1:refs/remotes/origin/arch/gpt-synthesis-v1
          git merge-base --is-ancestor HEAD refs/remotes/origin/arch/gpt-synthesis-v1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install bounded browser runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . 'playwright==1.55.0'
          google-chrome --version

      - name: Add network egress guardrails
        shell: bash
        run: |
          set -euo pipefail
          sudo iptables -N OLIVIA_BROWSER 2>/dev/null || sudo iptables -F OLIVIA_BROWSER
          sudo iptables -C OUTPUT -j OLIVIA_BROWSER 2>/dev/null || sudo iptables -I OUTPUT 1 -j OLIVIA_BROWSER
          DNS4="$(awk '/^nameserver / && $2 ~ /^[0-9.]+$/ {print $2; exit}' /etc/resolv.conf || true)"
          if [ -n "$DNS4" ]; then
            sudo iptables -A OLIVIA_BROWSER -d "$DNS4" -p udp --dport 53 -j ACCEPT
            sudo iptables -A OLIVIA_BROWSER -d "$DNS4" -p tcp --dport 53 -j ACCEPT
          fi
          for cidr in             0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8             169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24             192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24             224.0.0.0/4 240.0.0.0/4
          do
            sudo iptables -A OLIVIA_BROWSER -d "$cidr" -j REJECT
          done
          if command -v ip6tables >/dev/null 2>&1; then
            sudo ip6tables -N OLIVIA_BROWSER6 2>/dev/null || sudo ip6tables -F OLIVIA_BROWSER6
            sudo ip6tables -C OUTPUT -j OLIVIA_BROWSER6 2>/dev/null || sudo ip6tables -I OUTPUT 1 -j OLIVIA_BROWSER6
            DNS6="$(awk '/^nameserver / && $2 ~ /:/ {print $2; exit}' /etc/resolv.conf || true)"
            if [ -n "$DNS6" ]; then
              sudo ip6tables -A OLIVIA_BROWSER6 -d "$DNS6" -p udp --dport 53 -j ACCEPT || true
              sudo ip6tables -A OLIVIA_BROWSER6 -d "$DNS6" -p tcp --dport 53 -j ACCEPT || true
            fi
            for cidr in ::/128 ::1/128 fc00::/7 fe80::/10 2001:db8::/32 ff00::/8
            do
              sudo ip6tables -A OLIVIA_BROWSER6 -d "$cidr" -j REJECT || true
            done
          fi

      - name: Render public page with JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python scripts/browser_snapshot.py             --url "$TARGET_URL"             --output browser-result.json             --screenshot browser-shot.png
          test -s browser-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("browser-result.json").read_text(encoding="utf-8"))
          assert str(payload.get("final_url", "")).startswith(("http://", "https://"))
          assert len(str(payload.get("text", ""))) <= 30000
          assert int(payload.get("request_count", 0)) <= 101
          PY

      - name: Upload bounded browser result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-result
          path: |
            browser-result.json
            browser-shot.png
          if-no-files-found: error
          retention-days: 1
