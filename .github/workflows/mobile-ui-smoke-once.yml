name: 0liviA Mobile UI Smoke Once

on:
  push:
    branches:
      - arch/gpt-synthesis-v1
    paths:
      - ".github/mobile-ui-smoke-trigger"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/gpt-synthesis-v1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.55.0'
          google-chrome --version

      - name: Serve static shell
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory web >/tmp/olivia-ui-http.log 2>&1 &
          echo $! > /tmp/olivia-ui-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep .2
          done
          exit 1

      - name: Verify 360x800 and 430x900
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def run():
              evidence = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch(channel="chrome", headless=True)
                  for width, height in ((360, 800), (430, 900)):
                      context = await browser.new_context(
                          viewport={"width": width, "height": height},
                          device_scale_factor=1,
                          is_mobile=True,
                          has_touch=True,
                      )
                      page = await context.new_page()
                      await page.goto("http://127.0.0.1:8765/", wait_until="domcontentloaded")
                      await page.wait_for_timeout(700)
                      metrics = await page.evaluate("""() => ({
                        innerWidth: window.innerWidth,
                        bodyScrollWidth: document.body.scrollWidth,
                        docScrollWidth: document.documentElement.scrollWidth,
                        bodyScrollHeight: document.body.scrollHeight,
                        viewportHeight: window.innerHeight,
                        railWidth: document.querySelector('.rail')?.getBoundingClientRect().width || 0,
                        composerBottom: window.innerHeight - (document.querySelector('.composer-wrap')?.getBoundingClientRect().bottom || 0)
                      })""")
                      assert metrics["bodyScrollWidth"] <= metrics["innerWidth"], metrics
                      assert metrics["docScrollWidth"] <= metrics["innerWidth"], metrics
                      assert 44 <= metrics["railWidth"] <= 54, metrics
                      assert abs(metrics["composerBottom"]) <= 2, metrics

                      await page.locator('button[data-side="session"]').first.click()
                      await page.wait_for_timeout(300)
                      drawer = await page.locator("#drawer").get_attribute("class")
                      assert drawer and "open" in drawer, drawer
                      drawer_box = await page.locator("#drawer").bounding_box()
                      assert drawer_box and drawer_box["x"] >= 46, drawer_box
                      assert drawer_box["x"] + drawer_box["width"] <= width + 1, drawer_box

                      await page.screenshot(
                          path=f"mobile-{width}x{height}.png",
                          full_page=False,
                          animations="disabled",
                      )
                      evidence.append({
                          "viewport": [width, height],
                          "metrics": metrics,
                          "drawer": drawer_box,
                      })
                      await context.close()
                  await browser.close()
              Path("mobile-ui-smoke.json").write_text(
                  json.dumps(evidence, indent=2), encoding="utf-8"
              )

          asyncio.run(run())
          PY

      - name: Upload mobile UI evidence
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ui-smoke
          path: |
            mobile-ui-smoke.json
            mobile-360x800.png
            mobile-430x900.png
          if-no-files-found: error
          retention-days: 1
